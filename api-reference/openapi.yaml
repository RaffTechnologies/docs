        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/apps/services/{service_id}/env:
    get:
      tags:
        - Raff Apps
      summary: List environment variables
      description: Secret values are masked; use the reveal endpoint to read them.
      operationId: listAppEnvVars
      parameters:
        - $ref: '#/components/parameters/AppServiceRef'
      responses:
        '200':
          description: Environment variables
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  env_vars:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppEnvVar'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Raff Apps
      summary: Set environment variable
      description: |
        Create or update one variable. By default the change rolls out to
        running replicas. Set `redeploy: false` to defer it to the next deploy.
      operationId: setAppEnvVar
      parameters:
        - $ref: '#/components/parameters/AppServiceRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
