                    items:
                      $ref: '#/components/schemas/AppDeployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Raff Apps
      summary: Create deployment
      description: |
        Build and roll out a new deployment. Provide a `source_blob_key` from
        a completed source upload, or an `image_ref` for a prebuilt image.
        Git-connected services deploy their branch head when neither is given.
      operationId: createAppDeployment
      parameters:
        - $ref: '#/components/parameters/AppServiceRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppDeploymentRequest'
      responses:
        '201':
          description: Deployment queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deployment:
                    $ref: '#/components/schemas/AppDeployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/apps/deployments/{deployment_id}:
    get:
      tags:
        - Raff Apps
      summary: Get deployment
      operationId: getAppDeployment
      parameters:
        - $ref: '#/components/parameters/AppDeploymentIDPath'
      responses:
        '200':
          description: Deployment status
          content:
            application/json:
              schema:
                type: object
                properties:
