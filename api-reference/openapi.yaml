  # ---------------------------------------------------------------------------
  # Kubernetes — managed clusters
  # ---------------------------------------------------------------------------

  /api/v1/k8s/versions:
    get:
      tags:
        - Kubernetes
      summary: List Kubernetes versions
      description: Kubernetes versions available for new clusters. Use `id` as `k8s_version_id` when creating a cluster.
      operationId: listK8sVersions
      responses:
        '200':
          description: Available versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/K8sVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/k8s/node-plans:
    get:
      tags:
        - Kubernetes
      summary: List Kubernetes node plans
      description: Worker node plans plus HA control-plane and storage-node pricing. Same data as `GET /api/v1/public/pricing/kubernetes`.
      operationId: listK8sNodePlans
      responses:
        '200':
          description: Node plans and pricing
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/K8sNodePlan'
                  ha_pricing:
                    $ref: '#/components/schemas/K8sHAPricing'
                  storage_pricing:
                    $ref: '#/components/schemas/K8sStoragePricing'

  /api/v1/k8s/clusters:
    get:
      tags:
        - Kubernetes
      summary: List Kubernetes clusters
      description: |
        List clusters for the authenticated account, newest first.

        Pass `X-Project-ID` to scope the list to a single project. When omitted, returns clusters across every project the API key has access to.
      operationId: listK8sClusters
      parameters:
        - name: X-Project-ID
          in: header
          required: false
          description: Optional project ID to scope the list. Omit to list across all accessible projects.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Page size (max 200)
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of clusters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  clusters:
                    type: array
                    items:
                      $ref: '#/components/schemas/K8sCluster'
                  total:
                    type: integer
                    description: Total clusters matching the filter (before pagination)
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Kubernetes
      summary: Create Kubernetes cluster
      description: |
        Create a managed Kubernetes cluster. Provisioning is asynchronous — the response returns immediately with `pending` status; the cluster is usable when `ready` is `true` (typically 8–12 minutes).

        API-created clusters follow the account's billing mode: pay-as-you-go accounts bill per node-hour; subscription accounts are billed monthly — the API validates the saved payment method, creates the subscription, and charges it automatically (same behavior as VM creation).

        Retries are safe with an `Idempotency-Key` header: a repeated request with the same key returns the cluster created by the first request instead of provisioning a second one.
      operationId: createK8sCluster
      parameters:
        - $ref: '#/components/parameters/ProjectIDHeader'
        - name: Idempotency-Key
          in: header
          required: false
          description: Any unique string (max 128 chars). Reuse the same value when retrying a failed or timed-out request.
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateK8sClusterRequest'
      responses:
        '201':
          description: Cluster accepted for provisioning (status `pending`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cluster:
                    $ref: '#/components/schemas/K8sCluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientBalance'

  /api/v1/k8s/clusters/stats:
    get:
      tags:
        - Kubernetes
      summary: Get cluster utilization stats
      description: Batch utilization snapshot for one or more clusters (CPU, memory, pods, node readiness). Values refresh every 60 seconds.
      operationId: getK8sClusterStats
      parameters:
        - $ref: '#/components/parameters/ProjectIDHeader'
        - name: ids
          in: query
          required: false
          description: Comma-separated cluster IDs. Omit for all account clusters.
          schema:
            type: string
      responses:
        '200':
          description: Utilization per cluster
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: array
                    items:
                      $ref: '#/components/schemas/K8sClusterStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/k8s/clusters/{cluster_id}:
    get:
      tags:
        - Kubernetes
      summary: Get Kubernetes cluster
      operationId: getK8sCluster
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Cluster details including node pools
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cluster:
                    $ref: '#/components/schemas/K8sCluster'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Kubernetes
      summary: Rename Kubernetes cluster
      operationId: renameK8sCluster
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: New cluster name (1–63 lowercase letters, digits or hyphens)
                  example: prod-eu
      responses:
        '200':
          description: Cluster renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cluster:
                    $ref: '#/components/schemas/K8sCluster'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Kubernetes
      summary: Delete Kubernetes cluster
      description: |
        Delete a cluster and all its infrastructure (nodes, networking, reserved IPs, DNS). Deletion is asynchronous.

        If teardown cannot be completed, the cluster remains visible with status `delete_failed` and nothing is removed — repeat the delete to retry.
      operationId: deleteK8sCluster
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Deletion started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/k8s/clusters/{cluster_id}/kubeconfig:
    get:
      tags:
        - Kubernetes
      summary: Get kubeconfig
      description: |
        Issue a kubeconfig for the cluster. Every kubeconfig expires — the default lifetime is **7 days**; use `expires_in` to choose another (10 minutes to 30 days). Grants full cluster-admin access while valid, so store it like a password, and [rotate access](#tag/Kubernetes/operation/rotateK8sKubeconfigAccess) to invalidate every issued kubeconfig at once.

        For anything long-running (a workstation, CI), prefer the CLI: `raff kubernetes kubeconfig <cluster-id>` writes a kubeconfig that fetches a fresh token for every `kubectl` command, so it never expires and stores no credential on disk.
      operationId: getK8sKubeconfig
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - name: expires_in
          in: query
          required: false
          schema:
            type: integer
            minimum: 600
            maximum: 2592000
          description: |
            Kubeconfig lifetime in seconds (10 minutes to 30 days). Defaults to 7 days when omitted. Expired kubeconfigs stop working on their own.
      responses:
        '200':
          description: Kubeconfig for kubectl
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  kubeconfig:
                    type: string
                    description: kubeconfig YAML
                  api_endpoint:
                    type: string
                    example: https://q7z7zg.k8s.raffusercloud.com:6443
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/k8s/clusters/{cluster_id}/kubeconfig/rotate:
    post:
      tags:
        - Kubernetes
      summary: Rotate cluster access
      description: |
        Invalidates every previously issued short-lived kubeconfig for the cluster, immediately. Use it when a credential may have leaked or a team member leaves. Newly requested short-lived kubeconfigs keep working; the admin kubeconfig is unaffected.
      operationId: rotateK8sKubeconfigAccess
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Access rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/k8s/clusters/{cluster_id}/ha:
    post:
      tags:
        - Kubernetes
      summary: Upgrade to HA control plane
      description: |
        Promote a single-master cluster to a 3-master highly available control plane. The flat HA fee starts accruing once enabled.

        On a pay-as-you-go cluster the flat HA fee simply starts accruing. On a subscription cluster the API charges the pro-rated HA fee to the saved payment method (balance first) and raises the monthly price; in the dashboard the upgrade goes through checkout.
      operationId: upgradeK8sClusterHA
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: HA upgrade started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cluster already HA, or subscription-billed (upgrade via dashboard)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/k8s/clusters/{cluster_id}/upgrades:
    get:
      tags:
        - Kubernetes
      summary: List available version upgrades
      description: |
        The Kubernetes versions this cluster can upgrade to right now — patch releases of its current minor and the next minor (Kubernetes upgrades one minor at a time) — plus the cluster's upgrade state, mode and maintenance window.
      operationId: listK8sClusterUpgrades
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Upgrade state and available targets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  current_version:
                    type: string
                    example: v1.33.4+rke2r1
                  upgrade_status:
                    type: string
                    enum: [idle, scheduled, upgrading, failed]
                  target_version:
                    type: string
                    description: Set while an upgrade is in flight or failed
                  upgrade_mode:
                    type: string
                    enum: [manual, auto_patch, auto_minor]
                  maintenance_day:
                    type: integer
                    description: 0 (Sunday) to 6 (Saturday)
                  maintenance_start:
                    type: integer
                    description: Window start hour (UTC); the window is 4 hours
                  available:
                    type: array
                    items:
                      type: object
                      properties:
                        version_id:
                          type: integer
                        version:
                          type: string
                          example: v1.34+rke2r1
                        rke2_version:
                          type: string
                          example: v1.34.6+rke2r1
                        is_minor:
                          type: boolean
                          description: true for a minor hop, false for a patch
                        is_default:
                          type: boolean
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/k8s/clusters/{cluster_id}/upgrade:
    post:
      tags:
        - Kubernetes
      summary: Start a version upgrade
      description: |
        Start an in-place Kubernetes upgrade to one of the versions from [List available version upgrades](#tag/Kubernetes/operation/listK8sClusterUpgrades). The upgrade is rolling: control-plane nodes one at a time, then workers drained first (PodDisruptionBudgets honoured). HA clusters upgrade with no API interruption; single-master clusters have a brief interruption and require `confirm_single_master: true`. Progress appears in the cluster events; upgrades are free.
      operationId: upgradeK8sClusterVersion
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_id]
              properties:
                version_id:
                  type: integer
                  description: Target from List available version upgrades
                confirm_single_master:
                  type: boolean
                  description: Required true on non-HA clusters
      responses:
        '200':
          description: Upgrade started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid target (skew policy, unknown version, downgrade)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: Pre-flight refused (busy pool, unconfirmed single-master)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/k8s/clusters/{cluster_id}/maintenance:
    patch:
      tags:
        - Kubernetes
      summary: Set upgrade mode and maintenance window
      description: |
        `manual` (default) — you start upgrades yourself. `auto_patch` — patch releases are applied automatically in the maintenance window (notice email ~72h before). `auto_minor` — minors too, after a stability period. The window is 4 hours from `maintenance_start` (UTC) on `maintenance_day`.
      operationId: updateK8sClusterMaintenance
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upgrade_mode]
              properties:
                upgrade_mode:
                  type: string
                  enum: [manual, auto_patch, auto_minor]
                maintenance_day:
                  type: integer
                  minimum: 0
                  maximum: 6
                  description: 0 (Sunday) to 6 (Saturday)
                maintenance_start:
                  type: integer
                  minimum: 0
                  maximum: 23
                  description: Window start hour (UTC)
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid mode or window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/k8s/clusters/{cluster_id}/pools:
    get:
      tags:
        - Kubernetes
      summary: List node pools
      operationId: listK8sNodePools
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Node pools with their nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  node_pools:
                    type: array
                    items:
                      $ref: '#/components/schemas/K8sNodePool'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Kubernetes
      summary: Add node pool
      description: |
        Add a node pool. Nodes deploy asynchronously; the pool is `running` once every node has joined.

        On a pay-as-you-go cluster the new nodes accrue hourly. On a subscription cluster the API charges the pro-rated cost of the new pool to the saved payment method (balance first) and raises the monthly price; in the dashboard the addition goes through checkout.
      operationId: addK8sNodePool
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddK8sNodePoolRequest'
      responses:
        '201':
          description: Node pool created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  node_pool:
                    $ref: '#/components/schemas/K8sNodePool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Subscription-billed cluster — add the pool via the dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/k8s/clusters/{cluster_id}/pools/{pool_id}:
    patch:
      tags:
        - Kubernetes
      summary: Update node pool
      description: Update a pool's autoscaling bounds, labels and taints. Labels and taints are applied to the pool's Kubernetes nodes within a minute.
      operationId: updateK8sNodePool
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/K8sPoolIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateK8sNodePoolRequest'
      responses:
        '200':
          description: Updated node pool
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  node_pool:
                    $ref: '#/components/schemas/K8sNodePool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Kubernetes
      summary: Delete node pool
      description: |
        Remove a pool and all its nodes. Each node is cordoned and drained (PodDisruptionBudgets are honoured) before its VM is terminated, one at a time; the operation runs asynchronously and stops — with the pool intact — if a node cannot be emptied.

        The last pool of a cluster cannot be deleted, and the cluster keeps at least 2 worker nodes.
      operationId: deleteK8sNodePool
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/K8sPoolIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Pool deletion started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/k8s/clusters/{cluster_id}/pools/{pool_id}/scale:
    post:
      tags:
        - Kubernetes
      summary: Scale node pool
      description: |
        Set the pool's node count (2–20). Scale-up deploys new nodes; scale-down cordons and drains the newest nodes first — honouring PodDisruptionBudgets, never force-deleting — then removes their VMs. Both run asynchronously; watch the pool's `status` and `status_message`.

        Scale-down credits the remainder on every cluster. Scale-up on a pay-as-you-go cluster accrues hourly; on a subscription cluster the API charges the pro-rated difference to the saved payment method (balance first) and raises the monthly price, while the dashboard routes it through checkout.
      operationId: scaleK8sNodePool
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/K8sPoolIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_count]
              properties:
                node_count:
                  type: integer
                  minimum: 2
                  maximum: 20
                  example: 3
      responses:
        '200':
          description: Scaling started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  new_node_count:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Pool busy (already scaling), or subscription-billed scale-up (use the dashboard)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/k8s/clusters/{cluster_id}/nodes:
    get:
      tags:
        - Kubernetes
      summary: List cluster nodes
      description: All nodes of the cluster (control plane, workers, storage, gateway) merged with live Kubernetes state when reachable.
      operationId: listK8sClusterNodes
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Cluster nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/K8sClusterNode'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/k8s/clusters/{cluster_id}/events:
    get:
      tags:
        - Kubernetes
      summary: List cluster events
      description: Lifecycle events (provisioning steps, scaling, autoscaling, warnings), newest first.
      operationId: listK8sClusterEvents
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Cluster events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/K8sClusterEvent'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/k8s/clusters/{cluster_id}/volumes:
    get:
      tags:
        - Kubernetes
      summary: List cluster volumes
      description: >-
        The cluster's persistent volumes — created automatically by
        PersistentVolumeClaims on the `raff-block` storage class and billed
        per GB. Manage them through Kubernetes (`kubectl`), not this API:
        grow by editing the claim's requested size, delete by deleting the
        claim.
      operationId: listK8sClusterVolumes
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Cluster volumes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  volumes:
                    type: array
                    items:
                      type: object
                      properties:
                        volume_id:
                          type: integer
                        name:
                          type: string
                          description: Display name (`<cluster>-<namespace>-<claim>`)
                          example: k7n92s-data-postgres-data-postgresql-0
                        pv_name:
                          type: string
                          description: Kubernetes PersistentVolume name
                        size_gb:
                          type: integer
                        status:
                          type: string
                          enum: [creating, available, attached]
                        node_ip:
                          type: string
                          description: Internal IP of the worker it is attached to ("" when detached)
                        price_per_hour:
                          type: number
                          format: double
                        created_at:
                          type: string
                          format: date-time
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/k8s/clusters/{cluster_id}/metrics:
    get:
      tags:
        - Kubernetes
      summary: Get cluster metrics
      description: Live utilization (CPU, memory, pods, per-node breakdown) plus a 24-hour control-plane health summary. Values refresh every 60 seconds.
      operationId: getK8sClusterMetrics
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Cluster metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cpu_used_millicores:
                    type: integer
                  cpu_capacity_millicores:
                    type: integer
                  mem_used_bytes:
                    type: integer
                  mem_capacity_bytes:
                    type: integer
                  pod_count:
                    type: integer
                  pod_capacity:
                    type: integer
                  nodes_ready:
                    type: integer
                  nodes_total:
                    type: integer
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/K8sNodeMetrics'
                  control_plane:
                    $ref: '#/components/schemas/K8sControlPlaneHealth'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Cluster unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/k8s/clusters/{cluster_id}/firewall:
    get:
      tags:
        - Kubernetes
      summary: Get cluster firewall
      description: The security group protecting the cluster's public gateway, and the account's security groups available to assign.
      operationId: getK8sClusterFirewall
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Firewall state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/K8sFirewallState'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Kubernetes
      summary: Assign cluster firewall
      operationId: assignK8sClusterFirewall
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [security_group_id]
              properties:
                security_group_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Security group assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Kubernetes
      summary: Reset cluster firewall
      description: Detach the custom security group and restore the platform baseline.
      operationId: resetK8sClusterFirewall
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Firewall reset to baseline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/k8s/clusters/{cluster_id}/metallb-pool:
    get:
      tags:
        - Kubernetes
      summary: Get MetalLB address pool
      operationId: getK8sMetalLBPool
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: MetalLB pool state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  pool:
                    $ref: '#/components/schemas/K8sMetalLBPool'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Kubernetes
      summary: Resize MetalLB address pool
      description: Set how many private IPs MetalLB can hand to `LoadBalancer` services.
      operationId: updateK8sMetalLBPool
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size]
              properties:
                size:
                  type: integer
                  example: 16
      responses:
        '200':
          description: Updated pool
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  pool:
                    $ref: '#/components/schemas/K8sMetalLBPool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/k8s/clusters/{cluster_id}/tcp-ports:
    get:
      tags:
        - Kubernetes
      summary: List TCP port forwards
      description: L4 forwards published on the cluster's public gateway (created when exposing an app over TCP).
      operationId: listK8sTcpPorts
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Active TCP forwards
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  forwards:
                    type: array
                    items:
                      $ref: '#/components/schemas/K8sTcpForward'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/k8s/clusters/{cluster_id}/tcp-ports/{port}:
    delete:
      tags:
        - Kubernetes
      summary: Delete TCP port forward
      operationId: deleteK8sTcpPort
      parameters:
        - $ref: '#/components/parameters/K8sClusterIDPath'
        - $ref: '#/components/parameters/ProjectIDHeader'
        - name: port
          in: path
          required: true
          description: Public port of the forward
          schema:
            type: integer
      responses:
        '200':
          description: Forward removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication. Each key is bound to a specific account.
  parameters:
    FunctionRef:
      name: function_id
      in: path
      required: true
      description: Function ID, short id (`fn-…`), URL slug, or name
      schema:
        type: string
    DatabaseIDPath:
      name: database_id
      in: path
      required: true
      description: Database ID (UUID) or short id (the `database_id` field, e.g. `a1b2c3d4`)
      schema:
        type: string
    AppServiceRef:
      name: service_id
      in: path
      required: true
      description: App service ID (UUID) or short id (the `service_id` field)
      schema:
        type: string
    AppDeploymentIDPath:
      name: deployment_id
      in: path
      required: true
      description: Deployment ID (UUID)
      schema:
        type: string
        format: uuid
    AppDomainIDPath:
      name: domain_id
      in: path
      required: true
      description: Custom domain ID (UUID)
      schema:
        type: string
        format: uuid
    VMIDPath:
      name: id
      in: path
      required: true
      description: VM ID (UUID)
      schema:
        type: string
        format: uuid
    ProjectIDPath:
      name: id
      in: path
      required: true
      description: Project ID (UUID)
      schema:
        type: string
        format: uuid
    ProjectIDHeader:
      name: X-Project-ID
      in: header
      required: true
      description: Project ID. Required for all mutating operations (create, delete, power actions, resize).
      schema:
        type: string
        format: uuid
    NICIDPath:
      name: nic_id
      in: path
      required: true
      description: |
        Network interface ID. Get it from the `nic_id` field of `GET /api/v1/vms/{id}/networks`.
      schema:
        type: integer
    TagIDPath:
      name: tagId
      in: path
      required: true
      description: |
        Tag ID (UUID). Get it from the `tags` array on `GET /api/v1/vms/{id}` — each tag has an `id` field.
      schema:
        type: string
        format: uuid
    SecurityGroupIDPath:
      name: sg_id
      in: path
      required: true
      description: |
        Security group ID (UUID). Get it from the `security_group_id` field of `GET /api/v1/vms/{id}/networks`, or list all account security groups via `GET /api/v1/security-groups`.
      schema:
        type: string
        format: uuid
    SecurityGroupResourceIDPath:
      name: id
      in: path
      required: true
      description: Security group ID (UUID).
      schema:
        type: string
        format: uuid
    NoteTypePath:
      name: type
      in: path
      required: true
      description: Note scope. `personal` is visible only to the writer; `account` is shared across the account.
      schema:
        type: string
        enum: [personal, account]
    VPCIDPath:
      name: id
      in: path
      required: true
      description: VPC ID (UUID).
      schema:
        type: string
        format: uuid
    IPIDPath:
      name: id
      in: path
      required: true
      description: Floating IP ID (UUID).
      schema:
        type: string
        format: uuid

    K8sClusterIDPath:
      name: cluster_id
      in: path
      required: true
      description: Cluster ID (short id, e.g. `q7z7zg`)
      schema:
        type: string
    K8sPoolIDPath:
      name: pool_id
      in: path
      required: true
      description: Node pool ID
      schema:
        type: string
        format: uuid
  schemas:
    DeleteVMRequest:
      type: object
      properties:
        volume_action:
          type: string
          enum:
            - detach
            - delete
          default: delete
          description: What to do with attached volumes. `detach` keeps them (still billable), `delete` removes them permanently.
        delete_vpc:
          type: boolean
          default: true
          description: Whether to delete the associated VPC. Only succeeds if no other VMs are using it.

    DeleteVMsBulkRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 50
          description: VM IDs to delete (1–50).
        volume_action:
          type: string
          enum:
            - detach
            - delete
          default: delete
          description: What to do with attached volumes. `detach` keeps them (still billable), `delete` removes them permanently.
        delete_vpc:
          type: boolean
          default: true
          description: Whether to delete associated VPCs. Only succeeds if no other VMs are using them.

    BulkDeleteVMsResult:
      type: object
      properties:
        success:
          type: boolean
          description: "`true` if at least one VM was deleted successfully."
        message:
          type: string
        total_count:
          type: integer
          description: Number of VMs requested for deletion.
        success_count:
          type: integer
          description: Number of VMs successfully deleted.
        failed_count:
          type: integer
          description: Number of VMs that failed to delete.
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkDeleteVMItemResult'
          description: Per-VM deletion results.

    BulkDeleteVMItemResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: VM ID.
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
          description: Error detail if deletion failed.

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    BillingError:
      type: object
      description: Billing validation error response. Returned when the account is not in good standing for paid operations.
      required:
        - error
        - reason
      properties:
        error:
          type: string
          example: Billing validation failed
        message:
          type: string
          example: Payment failed. Please update your payment method.
        reason:
          type: string
          description: |
            Machine-readable reason code:
            - `banned` — account has been suspended
            - `failed` — last payment failed; balance top-up needed
            - `no_billing_customer` — billing has not been set up for this account
          enum:
            - banned
            - failed
            - no_billing_customer

    VM:
      type: object
      required:
        - id
        - name
        - status
        - cpu
        - ram
        - storage
        - added_storage
        - total_storage
        - template_id
        - template_name
        - template_version
        - price_per_hour
        - pricing_id
        - region
        - active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique VM identifier
        name:
          type: string
          description: VM display name
          example: my-ubuntu-server
        status:
          type: string
          enum: [active, passive, provisioning, booting, initiating, finalizing, failure]
          description: |
            Current VM status. Lifecycle transitions:
            - Creation: `initiating` → `provisioning` → `booting` → `active`
            - Stop: `active` → `finalizing` → `passive`
            - Start: `passive` → `booting` → `active`
            - Reboot: `active` → `booting` → `active`

            | Status | Meaning | Billable |
            |--------|---------|----------|
            | `initiating` | Queued, initial setup before provisioning | Yes |
            | `provisioning` | VM being created in the hypervisor | Yes |
            | `booting` | VM starting up | Yes |
            | `active` | Running and accessible | Yes |
            | `passive` | Stopped, resources still reserved | Yes |
            | `finalizing` | Shutting down | Yes |
            | `failure` | Creation or operation failed | No |
        cpu:
          type: integer
          description: Number of vCPU cores
          example: 2
        ram:
          type: integer
          description: RAM in GB
          example: 4
        storage:
          type: integer
          description: Base storage in GB
          example: 80
        added_storage:
          type: integer
          description: Additional storage in GB
          example: 0
        total_storage:
          type: integer
          description: Total storage (base + added) in GB
          example: 80
        template_id:
          type: string
          format: uuid
          description: OS template ID used to create this VM
        template_name:
          type: string
          description: OS template name
          example: Ubuntu
        template_version:
          type: string
          description: OS template version
          example: "24.10x64"
        version:
          type: string
          description: VM version
        price_per_hour:
          type: string
          description: Hourly billing rate in USD
          example: "0.027764"
        pricing_id:
          type: integer
          description: Pricing plan ID
          example: 3
        created_by:
          type: string
          description: User ID who created this VM
        billing_type:
          type: string
          description: Billing type for this VM
          enum: [payg, subscription]
          example: payg
        subscription_id:
          type: string
          format: uuid
          description: Subscription ID if billing_type is subscription
        backup_type:
          type: string
          description: Backup schedule type
          nullable: true
          example: weekly
        region:
          type: string
          enum: [us-east]
          description: Data center region
          example: us-east
        project_id:
          type: string
          format: uuid
          description: Project this VM belongs to
        public_ipv4_address:
          type: string
          description: Public IPv4 address
          example: "15.204.178.3"
        public_ipv6_address:
          type: string
          description: Public IPv6 address
          nullable: true
        private_ipv4_address:
          type: string
          description: Private IPv4 address (VPC)
          example: "10.10.0.96"
        private_ipv6_address:
          type: string
          description: Private IPv6 address
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/VMTag'
          description: Custom tags
        active:
          type: boolean
          description: Whether the VM is active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateVMRequest:
      type: object
      required:
        - name
        - template_id
        - pricing_id
        - region
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: VM display name
          example: my-ubuntu-server
        template_id:
          type: string
          format: uuid
          description: "OS template ID. Use `GET /api/v1/public/templates` to list available templates."
          example: "5ac21891-32e6-41ce-8a93-b5d6ab708b0d"
        pricing_id:
          type: integer
          minimum: 1
          maximum: 13
          description: "Pricing plan ID that determines vCPU, RAM, storage, and bandwidth. Use `GET /api/v1/public/pricing/vm` to list available plans."
          example: 3
        region:
          type: string
          enum: [us-east]
          description: Data center region
          example: us-east
        ssh_keys:
          type: array
          items:
            type: string
          description: SSH public keys for VM access. Required for Linux VMs if no password is provided. Ignored for Windows VMs.
        password:
          type: string
          minLength: 12
          description: >-
            Root password for the VM. Required for Windows VMs. For Linux VMs, required if no SSH keys are provided. Both SSH keys and password can be set on Linux.
            Must be at least 12 characters with:
            2+ uppercase letters, 2+ digits, 1+ special character (@+-_.,!).
            Only alphanumeric characters and @+-_.,! are allowed.
        extra_storage:
          type: integer
          minimum: 0
          description: Additional block storage volume in GB (0–10,000). Attached as a separate disk to the VM.
          example: 100
        extra_storage_type:
          type: string
          enum: [ext4, xfs, btrfs]
          description: Filesystem type for extra storage. Required for Linux VMs with extra storage (defaults to ext4 if omitted). For Windows VMs, storage is automatically formatted as NTFS — this field is ignored.
          example: ext4
        backup_type:
          type: string
          enum: [none, daily, weekly]
          description: "Set `daily` for daily backups or `weekly` for weekly backups. Use `none` or omit for no backups."
          example: weekly
        backup_time:
          type: string
          description: "Time of day to run backups (e.g. `8am`). Defaults to `8am` if not specified."
          example: "8am"
        backup_date:
          type: string
          description: "Day of the week for weekly backups (e.g. `Saturday`). Required when `backup_type` is `weekly`, ignored for daily backups. Valid values: Monday–Sunday."
          example: Saturday
        tags:
          type: array
          items:
            type: string
          description: Custom tags for the VM
        vpc_id:
          type: string
          format: uuid
          description: "Attach VM to an existing VPC by its ID. If omitted along with `vpc_name`, a VPC is auto-created."
        vpc_name:
          type: string
          minLength: 1
          maxLength: 64
          description: "Create a new VPC with this name. Must be used together with `vpc_cidr`."
          example: my-custom-vpc
        vpc_cidr:
          type: string
          description: "CIDR block for the new VPC (e.g. `10.0.1.0/24`). Must be used together with `vpc_name`."
          pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
          example: "10.0.1.0/24"
        skip_public_ip:
          type: boolean
          default: false
          description: |
            When `true`, the VM is created without a public IPv4 address. It will only be reachable on its VPC private IP, so a VPC is required — pass `vpc_id` (existing) or `vpc_name` + `vpc_cidr` (new), or leave VPC fields empty to auto-create one. Combining `skip_public_ip=true` with `skip_vpc=true` is rejected because the VM would have no network at all.
        skip_vpc:
          type: boolean
          default: false
          description: |
            When `true`, no VPC is created or attached. The VM will only have its public IP — no private networking. Cannot be combined with `skip_public_ip=true`.

    AddVMTagRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Tag name.
          example: production
        priority:
          type: integer
          description: Display priority (lower sorts first). Defaults to 0.
          example: 0

    UpdateVMTagRequest:
      type: object
      description: At least one field is required.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: New tag name.
        priority:
          type: integer
          description: New display priority.

    VMTagsResponse:
      type: object
      description: Returns the full updated tag list for the VM.
      required:
        - success
        - tags
      properties:
        success:
          type: boolean
          example: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/VMTag'

    VMNote:
      type: object
      description: A free-form note attached to a VM. `personal` notes are visible only to the writer; `account` notes are shared across the account.
      required:
        - id
        - vm_id
        - user_id
        - type
        - content
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Note identifier.
        vm_id:
          type: string
          format: uuid
          description: VM this note belongs to.
        user_id:
          type: string
          format: uuid
          description: User who wrote the note.
        type:
          type: string
          enum: [personal, account]
          description: Note scope.
        content:
          type: string
          description: Note text.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VMNotesResponse:
      type: object
      description: Personal and account notes for a VM. Either or both may be present.
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        personal_note:
          $ref: '#/components/schemas/VMNote'
        account_note:
          $ref: '#/components/schemas/VMNote'

    UpsertVMNoteRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: Note text. Pass an empty string to clear the note.

    VMNetwork:
      type: object
      description: A network interface attached to a VM.
      required:
        - nic_id
        - network_name
        - ip
        - type
      properties:
        nic_id:
          type: integer
          description: Interface ID. Use this when detaching from a VPC, IP, or security group.
          example: 0
        network_name:
          type: string
          description: Network name.
          example: vpc-prod
        ip:
          type: string
          description: IP address assigned to the interface (IPv4 or IPv6 depending on `type`).
          example: "10.0.1.42"
        mac:
          type: string
          description: MAC address of the interface. Stable for the lifetime of the VM — useful for static DHCP, packet captures, and disambiguating multiple NICs in scripts.
          example: "02:00:5e:00:53:0a"
        gateway:
          type: string
          description: Gateway IP for this interface.
          example: "10.0.1.1"
        type:
          type: string
          enum: [public, vpc, ipv6]
          description: |
            Interface type:
            - `public` — public IPv4 address
            - `vpc` — private IPv4 inside a VPC
            - `ipv6` — public IPv6 address
        security_group_id:
          type: string
          format: uuid
          description: ID of the security group attached to this NIC, if any.
        is_primary:
          type: boolean
          description: True for the VM's primary public IPv4 interface. A VM has at most one primary IPv4; additional public IPv4s report `false`.
          example: true

    AttachVPCRequest:
      type: object
      required:
        - vpc_id
      properties:
        vpc_id:
          type: string
          format: uuid
          description: VPC to attach the VM to.
        ip:
          type: string
          description: Specific private IP within the VPC's CIDR range. Auto-assigned if omitted.
          example: "10.0.1.42"

    AttachIPRequest:
      type: object
      description: |
        Provide **either** `ip_id` (attach an existing reserved IP) **or** `type` (auto-allocate a new IP). Don't combine — `ip_id` takes precedence and `type` is ignored when both are sent.
      properties:
        ip_id:
          type: string
          format: uuid
          description: |
            ID of a previously reserved IP. The IP must belong to the same account, be reserved, and not already attached to another VM. No new billing on attach — you're already paying for the reserved IP. Use this to add up to 4 public IPv4 addresses to a VM.
        type:
          type: string
          enum: [IPv4, IPv6]
          description: |
            IP family to auto-allocate. Used only when `ip_id` is omitted. Defaults to `IPv4`. Available only while the VM has no public IP of that family; the IP is included with the VM at no extra charge and is released back to the pool on detach.
        security_groups:
          type: array
          items:
            type: string
            format: uuid
          description: Security group IDs (UUIDs) to apply to the new NIC.

    AttachIPResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          properties:
            vm_id:
              type: string
              format: uuid
              description: VM the IP was attached to.
            ip_address:
              type: string
              description: The attached IP address.
            nic_id:
              type: integer
              description: NIC identifier for this attachment. Use it when detaching.
            mac:
              type: string

    AttachSecurityGroupRequest:
      type: object
      required:
        - security_group_id
        - nic_id
      properties:
        security_group_id:
          type: string
          format: uuid
          description: Security group to attach.
        nic_id:
          type: integer
          description: NIC to attach the security group to. Get from `GET /api/v1/vms/{id}/networks`.

    SaveImageRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Custom image name.
          example: web-server-baseline
        description:
          type: string
          description: Optional description for the saved image.
        disk_id:
          type: integer
          default: 0
          description: |
            Which disk to capture. `0` for the OS disk, `1+` for attached volumes.
        snapshot_id:
          type: integer
          default: -1
          description: |
            Source for the image. `-1` captures the current live disk state. Pass a snapshot ID to capture from a saved snapshot.

    VMImage:
      type: object
      description: A custom OS image saved from a VM disk. Use `id` as `template_id` when creating new VMs.
      required:
        - id
        - name
        - region
      properties:
        id:
          type: string
          format: uuid
          description: Image ID — use as `template_id` when creating a VM.
        name:
          type: string
          description: Image name.
        version:
          type: string
        description:
          type: string
        os_type:
          type: string
        is_windows:
          type: boolean
        region:
          type: string
          enum: [us-east]
        created_at:
          type: string
          format: date-time

    VPC:
      type: object
      description: A virtual private cloud (VPC).
      required:
        - id
        - name
        - cidr
        - status
        - region
      properties:
        id:
          type: string
          format: uuid
          description: VPC identifier.
        account_id:
          type: string
          format: uuid
          description: Account this VPC belongs to.
        project_id:
          type: string
          format: uuid
          description: Project this VPC belongs to.
        name:
          type: string
          description: VPC display name.
          example: vpc-prod
        cidr:
          type: string
          description: CIDR block for the VPC.
          example: "10.0.0.0/24"
        gateway:
          type: string
          description: Gateway IP for the VPC.
          example: "10.0.0.1"
        dns:
          type: string
          description: DNS server IP for the VPC.
        status:
          type: string
          description: VPC lifecycle status.
          example: active
        total_ips:
          type: integer
          description: Total addressable IPs in the VPC.
          example: 256
        used_ips:
          type: integer
          description: IPs currently leased to VMs.
          example: 4
        region:
          type: string
          enum: [us-east]
          description: Region where the VPC lives.
        gateway_type:
          type: string
          description: Gateway type (e.g. `none`, `nat`).
        router_public_ip:
          type: string
          description: Public IP of the VPC gateway, if a gateway is enabled.
        router_status:
          type: string
          description: Gateway router status.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VPCDetail:
      type: object
      description: |
        Detail wrapper returned by `GET /api/v1/vpcs/{id}`. Contains the core VPC under `vpc`, plus the configured IP range and the current set of IP leases (one entry per attached network interface).
      required:
        - vpc
      properties:
        vpc:
          $ref: '#/components/schemas/VPC'
        ip_range_start:
          type: string
          description: First IP in the VPC's allocatable range
          example: 10.0.1.10
        ip_range_end:
          type: string
          description: Last IP in the VPC's allocatable range
          example: 10.0.1.254
        leases:
          type: array
          description: Active IP leases on the VPC. Empty when no VMs are attached.
          items:
            $ref: '#/components/schemas/VPCLease'

    VPCLease:
      type: object
      description: A single IP lease on the VPC.
      required:
        - ip
        - nic_id
      properties:
        ip:
          type: string
          description: Leased IP address
          example: 10.0.1.42
        nic_id:
          type: integer
          description: NIC interface ID on the leased VM. Pair with `GET /api/v1/vms/{id}/networks` to identify the owning interface.

    CreateVPCRequest:
      type: object
      required:
        - name
        - cidr
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: VPC name.
          example: vpc-prod
        cidr:
          type: string
          pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
          description: CIDR block. Must not overlap with other VPCs in the account. See `GET /api/v1/vpcs/cidr-suggestions` for non-overlapping options.
          example: "10.0.0.0/24"
        region:
          type: string
          enum: [us-east]
          description: Region for the VPC. Defaults to `us-east`.
          example: us-east

    UpdateVPCRequest:
      type: object
      description: At least one field is required. CIDR cannot be changed after creation.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: New VPC name.
        description:
          type: string
          description: VPC description.

    CIDRSuggestionsResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        suggested:
          type: string
          description: Recommended CIDR — non-overlapping and right-sized for typical use.
          example: "10.1.0.0/24"
        suggested_ips:
          type: integer
          description: Number of usable IPs in the suggested block.
          example: 256
        alternatives:
          type: array
          description: Other non-overlapping CIDRs to choose from, sized small/medium/large.
          items:
            $ref: '#/components/schemas/CIDRSuggestion'
        existing_count:
          type: integer
          description: Number of VPCs you already have.

    CIDRSuggestion:
      type: object
      properties:
        cidr:
          type: string
          example: "10.2.0.0/24"
        available_ips:
          type: integer
          example: 256
        size:
          type: string
          enum: [small, medium, large]

    SecurityGroup:
      type: object
      description: A security group — a named set of inbound/outbound rules that can be attached to VM NICs.
      required:
        - id
        - name
        - rules
      properties:
        id:
          type: string
          format: uuid
          description: Security group ID.
        name:
          type: string
          example: web-server
        description:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/SecurityGroupRule'
        vm_count:
          type: integer
          description: Number of VM NICs currently using this security group.
        project_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SecurityGroupRule:
      type: object
      description: A single inbound or outbound rule.
      required:
        - protocol
        - rule_type
      properties:
        protocol:
          type: string
          enum: [TCP, UDP, ICMP, ICMPV6, IPSEC, ALL]
          description: Network protocol.
        rule_type:
          type: string
          enum: [INBOUND, OUTBOUND]
          description: Direction of traffic.
        range:
          type: string
          description: Port or port range. Single port (`80`) or range (`8000:9000`). Empty for ICMP/ALL.
          example: "80"
        ip:
          type: string
          description: Source/destination IP for the rule. Empty means any.
          example: "0.0.0.0"
        size:
          type: integer
          description: CIDR block size (e.g. `24` for /24). Used with `ip` to allow a network range.
        icmp_type:
          type: integer
          description: ICMP message type (only for ICMP/ICMPV6 protocols).

    SecurityGroupTemplate:
      type: object
      description: A pre-built security group template.
      required:
        - id
        - name
        - rules
      properties:
        id:
          type: string
          description: Template ID — pass as `template_id` when creating a security group.
          example: web-server
        name:
          type: string
          example: Web Server
        description:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/SecurityGroupRule'

    CreateSecurityGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: web-server
        description:
          type: string
        template_id:
          type: string
          description: Seed from a template. Template rules are copied, then merged with any explicit `rules`.
          example: web-server
        rules:
          type: array
          items:
            $ref: '#/components/schemas/SecurityGroupRule'

    UpdateSecurityGroupRequest:
      type: object
      description: At least one field is required. Passing `rules` replaces the entire rule set.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/SecurityGroupRule'

    FloatingIP:
      type: object
      description: A floating public IP address.
      required:
        - id
        - ip_address
        - type
        - status
        - reserved
      properties:
        id:
          type: string
          format: uuid
          description: IP identifier.
        account_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
          description: User who reserved the IP.
        ip_address:
          type: string
          description: The IP address.
          example: "203.0.113.42"
        type:
          type: string
          enum: [IPv4, IPv6]
          description: IP family.
        status:
          type: string
          enum: [free, in-use]
          description: |
            - `free` — IP is in the pool, not currently attached to any VM.
            - `in-use` — currently attached to a VM.
        reserved:
          type: boolean
          description: |
            Whether the IP is reserved (held for the account regardless of VM attachment). A reserved IP can be either `free` (held but not attached) or `in-use` (held and attached).
        region:
          type: string
          enum: [us-east]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReserveIPRequest:
      type: object
      description: Optional fields for IP reservation. Send an empty body to use defaults.
      properties:
        type:
          type: string
          enum: [IPv4, IPv6]
          default: IPv4
          description: IP family to reserve. Defaults to IPv4.
        region:
          type: string
          enum: [us-east]
          description: Region. Defaults to the project's default region.
        billing_period:
          type: string
          enum: [monthly, yearly, twenty_four_month]
          default: monthly
          description: Subscription billing period. Ignored for PAYG accounts.

    VMTag:
      type: object
      description: Custom tag attached to a VM.
      required:
        - id
        - name
        - priority
        - created_at
      properties:
        id:
          type: string
          description: Unique tag identifier
        name:
          type: string
          description: Tag name
        priority:
          type: integer
          description: Tag priority (ordering)
        created_at:
          type: string
          format: date-time
          description: When the tag was created

    RenameVMRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: New name for the virtual machine

    ReinstallVMRequest:
      type: object
      required:
        - template_id
      properties:
        template_id:
          type: string
          format: uuid
          description: ID of the OS template to reinstall with
        password:
          type: string
          description: New root/admin password. Either password or auto_generate_password should be provided.
        ssh_keys:
          type: array
          items:
            type: string
          description: SSH public keys for authentication
        auto_generate_password:
          type: boolean
          description: Auto-generate a password and email it to the account owner

    ResizeVMRequest:
      type: object
      required:
        - pricing_id
      properties:
        pricing_id:
          type: integer
          minimum: 1
          description: "Target pricing plan ID. Determines CPU, RAM, and included storage. Use `GET /api/v1/public/pricing/vm` to list available plans."

    ResizeVMDiskRequest:
      type: object
      required:
        - new_size
      properties:
        new_size:
          type: integer
          minimum: 1
          description: New disk size in GB. Must be larger than current size.

    Volume:
      type: object
      required:
        - id
        - name
        - volume_type
        - size
        - status
      properties:
        id:
          type: integer
          description: Volume ID. Use this in `/volumes/{id}` for get, delete, attach, detach, resize.
        account_id:
          type: string
          format: uuid
          description: Account that owns the volume
        project_id:
          type: string
          format: uuid
          description: Project the volume belongs to
        product_vm:
          type: string
          format: uuid
          description: UUID of the VM the volume is currently attached to. Empty when detached.
        name:
          type: string
          description: Volume display name
          example: data-vol-1
        volume_type:
          type: string
          description: Storage class
          enum: [nvme]
          example: nvme
        size:
          type: integer
          description: Volume size in GB
          example: 100
        status:
          type: string
          enum: [creating, available, attached, deleting, failed]
          description: |
            Volume lifecycle status:
            - `creating` — being provisioned on the hypervisor
            - `available` — ready, not attached to any VM
            - `attached` — attached to a VM (see `product_vm`)
            - `deleting` — being torn down
            - `failed` — creation or attach failed
        price_per_hour:
          type: string
          description: Hourly billing rate in USD
        region:
          type: string
          enum: [us-east]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateVolumeRequest:
      type: object
      required:
        - name
        - size
        - volume_type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Volume display name
          example: data-vol-1
        size:
          type: integer
          minimum: 1
          description: Volume size in GB
          example: 100
        volume_type:
          type: string
          enum: [nvme]
          description: Storage class
          example: nvme
        filesystem_type:
          type: string
