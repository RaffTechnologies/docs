      properties:
        resource_type:
          type: string
          enum: [vm, volume]
          description: Source type for the snapshot
        resource_id:
          type: string
          format: uuid
          description: Source VM UUID. Required when `resource_type` is `vm`.
        volume_id:
          type: integer
          description: Source volume ID. Required when `resource_type` is `volume`.
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Snapshot display name
          example: pre-upgrade

    RenameSnapshotRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: New snapshot display name

    Backup:
      type: object
      required:
        - id
        - name
        - storage_size
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Backup ID
        account_id:
          type: string
          format: uuid
          description: Account that owns the backup
        project_id:
          type: string
          format: uuid
          description: Project the backup belongs to
        created_by:
          type: string
          description: User ID that created the backup
        region:
          type: string
          enum: [us-east]
          description: Region the backup is stored in
        product_vm:
          type: string
          format: uuid
          description: Source VM UUID
        name:
          type: string
          description: Backup display name
        storage_size:
          type: integer
          description: |
            Backup size in **MB**. For incremental restore points this is the per-increment delta;
            for legacy standalone backups it is the full image size. Display in MB up to 1024,
            else convert to GB (`storage_size / 1024`). Pricing math: `(storage_size / 1024) * price_per_gb`.
        status:
          type: string
          description: |
            Backup lifecycle status. Common values:
            - `pending` — creation queued
            - `creating` — backup being captured
            - `ready` — available for restore
            - `restoring` — currently restoring to a VM
            - `failed` — creation or restore failed
        price_per_hour:
          type: string
          description: Hourly storage cost in USD
        expire_date:
          type: string
          format: date-time
          description: When the backup will be auto-pruned (only set when retention applies)
        increment_id:
          type: integer
          nullable: true
          description: |
            Restore-point position within an incremental backup series.

            - `null` — legacy standalone backup (no series).
            - `0` — first restore point of a series.
            - `1`, `2`, … — subsequent restore points in the same series.

            Backups that share the same series are deleted together. Deleting a single
            restore point that has older points in its series triggers a series-wide delete.
            Use [Delete backup series](/api-reference/virtual-machines/delete-backup-series)
            to remove a whole series explicitly, or
            [Reset backup series](/api-reference/virtual-machines/reset-backup-series)
            to start a fresh baseline on the next backup.
        created_at:
          type: string
          format: date-time

    CreateBackupRequest:
      type: object
      required:
        - vm_id
      properties:
        vm_id:
          type: string
          format: uuid
          description: Source VM UUID
        name:
          type: string
          maxLength: 128
          description: Optional backup display name. Defaults to a timestamped name.

    BackupSchedule:
      type: object
      required:
        - id
        - name
        - type
        - keep_count
      properties:
        id:
          type: integer
          description: Backup schedule ID. Use this value in `/backup-schedules/{id}` for get, update, and delete.
        account_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        created_by:
          type: string
        region:
          type: string
          enum: [us-east]
        product_vm:
          type: string
          format: uuid
          description: Source VM UUID
        name:
          type: string
          description: Schedule display name
        type:
          type: string
          enum: [daily, weekly]
          description: Schedule frequency
        runtime:
          type: string
          description: Human-readable schedule (e.g. `Daily at 8am`, `Saturday 8am`)
        keep_count:
          type: integer
          description: Number of backups retained before auto-pruning
        price_per_hour:
          type: string
          description: Hourly cost in USD
        size:
          type: string
          description: Total size of backups currently retained for this schedule
        created_at:
          type: string
          format: date-time
        enabled:
          type: boolean
          description: Whether the schedule is active. Disabled schedules never run.
        next_run_at:
          type: string
          format: date-time
          description: Next time this schedule runs (UTC).
        last_run_at:
          type: string
          format: date-time
          description: Last time this schedule ran. Absent if it has never run.
        last_run_status:
          type: string
          enum: [succeeded, failed, skipped]
          description: Outcome of the most recent run. Absent if it has never run.
        consecutive_failures:
          type: integer
          description: Consecutive failed runs. Resets to 0 on the next successful run.

    CreateBackupScheduleRequest:
      type: object
      required:
        - vm_id
        - type
        - time
        - keep_count
      properties:
        vm_id:
          type: string
          format: uuid
          description: Target VM UUID
        type:
          type: string
          enum: [daily, weekly]
          description: Schedule frequency
        time:
