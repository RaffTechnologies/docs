  /api/v1/apps/services:
    get:
      tags:
        - Raff Apps
      summary: List app services
      description: List app services for the authenticated account.
      operationId: listAppServices
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: service_type
          in: query
          description: "Filter by type: `web`, `private`, `worker`, `cron`, or `job`."
          schema:
            type: string
            enum: [web, private, worker, cron, job]
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of app services
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Raff Apps
      summary: Create app service
      description: |
        Create an app service. Provisioning is asynchronous — the service is
        created in status `pending` and moves through `building` and
        `deploying` to `live`; poll `GET /api/v1/apps/services/{service_id}`
        for progress.

        Choose a `service_type`: `web` (public HTTPS URL), `private`
        (in-cluster only), `worker` (long-running, no URL), `cron`
        (scheduled), or `job` (one-off). Pick a `source_type`: `git` (a
        connected GitHub repo), `image` (a prebuilt image), `template` (a
        starter), or `compose`. Deploy code afterwards with a source upload
        and a deployment, or set `deploy_now` for image sources.
      operationId: createAppService
      parameters:
        - $ref: '#/components/parameters/ProjectIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppServiceRequest'
      responses:
        '201':
          description: App service created (status `pending` while provisioning)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  service:
                    $ref: '#/components/schemas/AppService'
                  deployment_id:
                    type: string
                    format: uuid
                    description: Set when a deployment was queued at create time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '403':
          $ref: '#/components/responses/BillingValidationFailed'
        '409':
          description: A service with this name already exists in the project

  /api/v1/apps/services/{service_id}:
    get:
      tags:
        - Raff Apps
      summary: Get app service
      operationId: getAppService
      parameters:
        - $ref: '#/components/parameters/AppServiceRef'
      responses:
        '200':
          description: App service details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  service:
                    $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Raff Apps
      summary: Delete app service
      description: |
        Delete an app service. Deletion is asynchronous; the name and URL are
        released once it completes.
      operationId: deleteAppService
      parameters:
        - $ref: '#/components/parameters/AppServiceRef'
      responses:
        '200':
          description: Deletion accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  accepted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/apps/services/{service_id}/pause:
    post:
      tags:
        - Raff Apps
      summary: Pause app service
      description: Scale the service to zero and stop billing for replicas. Cron services are suspended.
      operationId: pauseAppService
      parameters:
        - $ref: '#/components/parameters/AppServiceRef'
      responses:
        '200':
          description: Paused service
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  service:
                    $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/apps/services/{service_id}/resume:
    post:
      tags:
        - Raff Apps
      summary: Resume app service
      description: Bring a paused service back to its configured replica count.
      operationId: resumeAppService
      parameters:
        - $ref: '#/components/parameters/AppServiceRef'
      responses:
        '200':
          description: Resumed service
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  service:
                    $ref: '#/components/schemas/AppService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/apps/services/{service_id}/scale:
    post:
      tags:
        - Raff Apps
      summary: Scale app service
      description: |
        Update the replica count, autoscaling bounds, or scale-to-zero. Live
        services apply the change with no downtime.
      operationId: scaleAppService
      parameters:
        - $ref: '#/components/parameters/AppServiceRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaleAppServiceRequest'
      responses:
        '200':
          description: Updated service
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  service:
                    $ref: '#/components/schemas/AppService'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/apps/services/{service_id}/source-upload:
    post:
      tags:
        - Raff Apps
      summary: Request source upload URL
      description: |
        Get a presigned URL to upload a source tarball (gzipped). After the
