        day_of_week:
          type: string
          enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
          description: Day of week. Required when `type` is `weekly`.
        keep_count:
          type: integer
          minimum: 2
          maximum: 100
          description: Number of backups to retain before auto-pruning (2-100)

    UpdateBackupScheduleRequest:
