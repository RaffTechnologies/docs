  /api/v1/roles/{id}:
    get:
      tags:
        - Roles
      summary: Get role
      operationId: getRole
      parameters:
        - name: id
          in: path
          required: true
          description: Role ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Role'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Roles
      summary: Update custom role
      description: |
        Update a custom role's name, description, or permission set. **System roles cannot be edited** — return `400 Bad Request`.

        Editing a role applies to every member and API key currently using it.
      operationId: updateRole
      parameters:
        - name: id
          in: path
          required: true
          description: Role ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Roles
      summary: Delete custom role
      description: |
        Delete a custom role. The role must not be in use by any member or API key — reassign them first or deletion will fail.

        System roles cannot be deleted.
      operationId: deleteRole
      parameters:
        - name: id
          in: path
          required: true
          description: Role ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/permissions:
    get:
      tags:
        - Permissions
      summary: List permissions
      description: |
        List the full catalog of permission strings recognized by the role system. Use this to discover valid values for the `permissions` array on [Create Role](#tag/Roles/operation/createRole) and [Update Role](#tag/Roles/operation/updateRole).

        Requires authentication, but no specific permission — any valid API key can read the catalog. The catalog is the same for every account.
      operationId: listPermissions
      parameters:
        - name: scope
          in: query
          description: Filter by scope
          schema:
            type: string
            enum: [account, project]
      responses:
        '200':
          description: List of permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'

  /api/v1/api-keys:
    get:
      tags:
        - API Keys
      summary: List API keys
      description: |
        List API keys belonging to the account. Only key prefixes are returned — full secrets are only shown once at create time.
      operationId: listApiKeys
      parameters:
        - name: scope
          in: query
          description: Filter by key scope. Customer-created keys are always `public`, so this is rarely useful — included for completeness.
          schema:
            type: string
            enum: [public]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - API Keys
      summary: Create API key
      description: |
        Create a new API key. The full secret is returned **once** in the `secret` field of the response — store it immediately. Subsequent reads only return the `key_prefix`.

        Pass `role_id` to bind the key to an account role; the key inherits that role's permissions. To grant per-project access, after creating the key add it as a [Project Member](#tag/Project-Members/operation/addProjectMember) on each project (passing `api_key_id`).
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created (full secret returned once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/APIKeyWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/api-keys/{id}:
    get:
      tags:
        - API Keys
      summary: Get API key
      description: Get an API key's metadata. The secret is never returned — only the prefix.
      operationId: getApiKey
      parameters:
        - name: id
          in: path
          required: true
          description: API key ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/APIKey'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - API Keys
      summary: Update API key
      description: |
        Update an API key's name, expiry, rate-limit tier, or active flag. Permissions cannot be changed via this endpoint — change the role assigned to the key instead, or rotate to a new key.
      operationId: updateApiKey
      parameters:
        - name: id
          in: path
          required: true
          description: API key ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAPIKeyRequest'
      responses:
        '200':
          description: API key updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/APIKey'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - API Keys
      summary: Revoke API key
      description: Permanently revoke an API key. In-flight requests using this key fail with `401`. Cannot be undone.
      operationId: revokeApiKey
      parameters:
        - name: id
          in: path
          required: true
          description: API key ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/api-keys/{id}/regenerate:
    post:
      tags:
        - API Keys
      summary: Regenerate API key
      description: |
        Rotate an API key — issues a new secret value and immediately invalidates the previous secret. The key keeps its name, scope, role, and expiration.

        The full new secret is returned **once** in `secret`. Update your secret store immediately.
      operationId: regenerateApiKey
      parameters:
        - name: id
          in: path
          required: true
          description: API key ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key regenerated (full secret returned once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/APIKeyWithSecret'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invitations:
    post:
      tags:
        - Invitations
      summary: Create account invitation
      description: |
        Send an email invitation for someone to join the account with the given role. The recipient gets an email with an accept link. Until they accept, the invitation appears in [List Members](#tag/Members/operation/listMembers) with `status: pending`.
      operationId: createAccountInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/invitations/{id}:
    delete:
      tags:
        - Invitations
      summary: Cancel invitation
      description: Cancel a pending invitation. The accept link in the recipient's email becomes invalid.
      operationId: cancelInvitation
      parameters:
        - name: id
          in: path
          required: true
          description: Invitation ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invitation cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{id}/invitations:
    post:
      tags:
        - Invitations
      summary: Create project invitation
      description: |
        Send an email invitation for someone to join a specific project with the given role. The recipient gets an email with an accept link.
      operationId: createProjectInvitation
      parameters:
        - $ref: '#/components/parameters/ProjectIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/engines:
    get:
      tags:
        - Managed Databases
      summary: List database engines
      description: |
        The database engine catalog: each engine with its display name, supported versions, and whether it is available to create. Engines listed with `available: false` (MySQL) are planned but cannot be created yet.
      operationId: listDatabaseEngines
      responses:
        '200':
          description: Engine catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  engines:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatabaseEngineInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/databases/plans:
    get:
      tags:
        - Managed Databases
      summary: List database plans
      description: |
        Pricing tiers for managed databases, plus the high availability, read replica, and extra storage pricing. Use the plan `id` as `plan_id` when creating or scaling a database.

        The same catalog is available without authentication at `GET /api/v1/public/pricing/database`.
      operationId: listDatabasePlans
      parameters:
        - name: engine
          in: query
          description: Filter plans by engine
          schema:
            $ref: '#/components/schemas/DatabaseEngine'
      responses:
        '200':
          description: Plans and add-on pricing
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatabasePricingPlan'
                  ha_pricing:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatabaseHAPricing'
                  replica_pricing:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatabaseReplicaPricing'
                  storage_pricing:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatabaseStoragePricing'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/databases:
    get:
      tags:
        - Managed Databases
      summary: List databases
      description: List all managed databases for the authenticated account.
      operationId: listDatabases
      responses:
        '200':
          description: List of databases
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  databases:
                    type: array
                    items:
                      $ref: '#/components/schemas/Database'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Managed Databases
      summary: Create database
      description: |
        Create a managed database. Provisioning is asynchronous — the database is created in status `pending` and moves through `deploying` to `running`; poll `GET /api/v1/databases/{database_id}` for progress.

        ## Networking

        Databases live on private VPC networking by default. Set `vpc_id` to place the private endpoint (`{database_id}.db.raffusercloud.com`) inside an existing VPC, or attach a VPC later via `POST /api/v1/databases/{database_id}/vpc`. Public access is optional and off by default. TLS is always required.

        ## Engines

        - **PostgreSQL** — pooled endpoint on port 6432 (PgBouncer, transaction mode) plus a direct endpoint on 5432. Nightly base backup with continuous WAL archiving for point-in-time restore.
        - **Valkey** — single TLS endpoint on port 6379. Nightly RDB snapshots plus on-demand snapshots. No read replicas — high availability adds a standby with automatic Sentinel failover.

        ## Pricing

        The plan sets the base price. High availability adds 70% of the tier price; storage above the tier allotment is $0.12/GB/month. See `GET /api/v1/public/pricing/database` for the full catalog.
      operationId: createDatabase
      parameters:
        - $ref: '#/components/parameters/ProjectIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRequest'
      responses:
        '201':
          description: Database created (status `pending` while provisioning)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  database:
                    $ref: '#/components/schemas/Database'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '403':
          $ref: '#/components/responses/BillingValidationFailed'

  /api/v1/databases/{database_id}:
    get:
      tags:
        - Managed Databases
      summary: Get database
      description: Get details of a managed database.
      operationId: getDatabase
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      responses:
        '200':
          description: Database details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  database:
                    $ref: '#/components/schemas/Database'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Managed Databases
      summary: Rename database
      description: Update the display name of a database. Connection endpoints are based on the immutable `database_id` and do not change.
      operationId: updateDatabase
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseRequest'
      responses:
        '200':
          description: Updated database
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  database:
                    $ref: '#/components/schemas/Database'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Managed Databases
      summary: Delete database
      description: |
        Permanently delete a managed database and its backups. This cannot be undone.

        If the database has an active subscription, the remaining prepaid balance is refunded pro-rata to your account balance.
      operationId: deleteDatabase
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      responses:
        '200':
          description: Deletion started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/scale:
    post:
      tags:
        - Managed Databases
      summary: Scale database
      description: |
        Change the plan, storage, high availability, or read replica count of a running database.

        - **Plan** — the new plan must be the same engine. Its included storage sets a floor: storage never shrinks below the new tier's allotment.
        - **Storage** — `storage_gb` can only grow. Omit (or `0`) to keep the current size.
        - **High availability** — set `set_ha: true` and put the desired state in `has_ha`. When `set_ha` is `false` or omitted, HA is unchanged.
        - **Read replicas** — `replica_count` is always applied: pass your current count when you are not changing it. PostgreSQL only; Valkey rejects a count above 0.
      operationId: scaleDatabase
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaleDatabaseRequest'
      responses:
        '200':
          description: Updated database
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  database:
                    $ref: '#/components/schemas/Database'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/connection:
    get:
      tags:
        - Managed Databases
      summary: Get connection details
      description: |
        Connection details for the database: host, port, username, database name, and a ready-to-use connection URI.

        The `password` field is empty unless you pass `reveal=true`. TLS is always required.
      operationId: getDatabaseConnection
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
        - name: reveal
          in: query
          description: Set to `true` to include the password in the response and connection URI
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Connection details
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                  - $ref: '#/components/schemas/DatabaseConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/credentials/rotate:
    post:
      tags:
        - Managed Databases
      summary: Rotate credentials
      description: |
        Generate a new password for the database user. Existing connections keep working until they disconnect; new connections must use the new password. Fetch it via `GET /api/v1/databases/{database_id}/connection?reveal=true`.
      operationId: rotateDatabaseCredentials
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      responses:
        '200':
          description: Credentials rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/vpc:
    post:
      tags:
        - Managed Databases
      summary: Connect database to VPC
      description: |
        Attach a database created without a VPC to one of your VPCs. The private endpoint `{database_id}.db.raffusercloud.com` becomes reachable from inside that VPC.
      operationId: connectDatabaseVPC
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectDatabaseVPCRequest'
      responses:
        '200':
          description: Database connected to the VPC
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  database:
                    $ref: '#/components/schemas/Database'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/public-access:
    post:
      tags:
        - Managed Databases
      summary: Set public access
      description: |
        Open or close public access to the database.

        When enabled, the database is reachable at `{database_id}.public.db.raffusercloud.com` on a port assigned from the reserved range 25060–26060 (`public_port` on the database object). For PostgreSQL, `public_port` is the pooled endpoint and `public_port + 1` is the direct endpoint. TLS is always required.

        `allowlist` restricts which source CIDRs may connect. Omit it to keep the stored list; pass `[]` to allow all sources. Re-post `enabled: true` with a new `allowlist` to update the restriction in place.
      operationId: setDatabasePublicAccess
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabasePublicAccessRequest'
      responses:
        '200':
          description: Updated database
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  database:
                    $ref: '#/components/schemas/Database'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/metrics:
    get:
      tags:
        - Managed Databases
      summary: Get metrics
      description: |
        Latest usage snapshot: CPU, memory, storage, connections, and replication lag. Metrics refresh about every 60 seconds; zero values mean not measured yet.
      operationId: getDatabaseMetrics
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      responses:
        '200':
          description: Latest metrics snapshot
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                  - $ref: '#/components/schemas/DatabaseMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/metrics/history:
    get:
      tags:
        - Managed Databases
      summary: Get metrics history
      description: Time-series metrics over a window, bucketed for charting.
      operationId: getDatabaseMetricsHistory
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
        - name: window_hours
          in: query
          description: History window in hours
          schema:
            type: integer
            default: 24
      responses:
        '200':
          description: Metric points, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  points:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatabaseMetricsPoint'
                  bucket_seconds:
                    type: integer
                    description: Seconds each point covers
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/slow-queries:
    get:
      tags:
        - Managed Databases
      summary: Get slow queries
      description: |
        The slowest recent queries.

        - **PostgreSQL** — aggregated statistics from `pg_stat_statements`: each row is one normalized query with its call count, mean, and total time.
        - **Valkey** — individual slow commands from `SLOWLOG`: `calls` is 1 per entry and `rows` is not applicable.

        `collecting` indicates whether statistics collection is active yet.
      operationId: getDatabaseSlowQueries
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
        - name: limit
          in: query
          description: Maximum number of entries to return
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Slow query entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  queries:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatabaseSlowQuery'
                  collecting:
                    type: boolean
                    description: Whether slow-query statistics are being collected
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/logs:
    get:
      tags:
        - Managed Databases
      summary: Get logs
      description: Recent engine log lines, newest last.
      operationId: getDatabaseLogs
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
        - name: tail
          in: query
          description: Number of log lines to return
          schema:
            type: integer
            default: 200
      responses:
        '200':
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  lines:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/extensions:
    get:
      tags:
        - Managed Databases
      summary: List extensions
      description: |
        The PostgreSQL extension allowlist with the installed state of each extension. Valkey has no extensions — the list is empty.
      operationId: listDatabaseExtensions
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      responses:
        '200':
          description: Extension catalog with installed state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  extensions:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatabaseExtension'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Managed Databases
      summary: Enable or disable extension
      description: Install or remove a PostgreSQL extension from the allowlist. PostgreSQL only.
      operationId: setDatabaseExtension
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDatabaseExtensionRequest'
      responses:
        '200':
          description: Extension updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/backups:
    get:
      tags:
        - Managed Databases
      summary: List backups
      description: |
        All backups for the database: nightly automatic backups (`base`) and on-demand backups (`on_demand`).
      operationId: listDatabaseBackups
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      responses:
        '200':
          description: List of backups
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  backups:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatabaseBackup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Managed Databases
      summary: Create backup
      description: |
        Start an on-demand backup — a base backup for PostgreSQL, an RDB snapshot for Valkey. The backup runs asynchronously; poll the list until its status is `completed`.
      operationId: createDatabaseBackup
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      responses:
        '201':
          description: Backup started (status `running`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  backup:
                    $ref: '#/components/schemas/DatabaseBackup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{database_id}/resume:
    post:
      tags:
        - Managed Databases
      summary: Resume a paused database
      description: |
        Wake a free-tier database that was suspended for idleness (no client
        connections for 7 days). The database returns through `deploying` and
        reaches `running` in about a minute; all data is preserved.
      operationId: resumeDatabase
      parameters:
        - name: database_id
          in: path
          required: true
          schema:
            type: string
          description: Database short ID
      responses:
        '200':
          description: Resume started
          content:
            application/json:
              schema:
                type: object
                properties:
                  database:
                    $ref: '#/components/schemas/Database'
        '400':
          description: The database is not paused
        '404':
          description: Database not found

  /api/v1/databases/{database_id}/restore:
    post:
      tags:
        - Managed Databases
      summary: Restore to a new database
      description: |
        Restore a database into a NEW instance. In-place restore is not supported — it would destroy the backup timeline it restores from — so `clone_to_new` must be `true`.

        Choose the restore point with `backup_id` (a specific completed backup) or, for PostgreSQL, `pitr_timestamp` (any point in time covered by continuous WAL archiving). Omit both to restore the latest available state.

        The clone inherits the source's plan, storage, VPC, and project, starts with no read replicas, and bills pay-as-you-go. High availability is an explicit choice via `ha_enabled` — never inherited. If `new_name` is taken, the platform auto-suffixes it (`-2`, `-3`, …).

        The clone provisions asynchronously; poll `GET /api/v1/databases/{new_database_id}` like any create.
      operationId: restoreDatabase
      parameters:
        - $ref: '#/components/parameters/DatabaseIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreDatabaseRequest'
      responses:
        '200':
          description: Restore started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  new_database_id:
                    type: string
                    description: Short ID of the new database being created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions:
    get:
      tags:
        - Functions
      summary: List functions
      description: List all serverless functions for the authenticated account.
      operationId: listFunctions
      parameters:
        - name: status
          in: query
          description: "Filter by status: `pending`, `building`, `live`, `paused`, `error`."
          schema:
            type: string
            enum: [pending, building, live, paused, error]
      responses:
        '200':
          description: List of functions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      functions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Function'
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Functions
      summary: Create function
      description: |
        Create a serverless function. The function serves at
        `https://{slug}.fn.raffusercloud.com` — the slug is your name plus a
        short random suffix, so names never collide across accounts.

        Functions unlock after your first top-up of $5 or more (the money
        stays in your balance). Deploy code afterwards with a source upload
        and a deployment, or use a starter template.

        Timeouts above 3600s require `extended_timeout: true` (max 86400s /
        24h). Long runs bill wall-clock memory while they execute — there is
        no extra fee.
      operationId: createFunction
      parameters:
        - $ref: '#/components/parameters/ProjectIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionRequest'
      responses:
        '201':
          description: Function created (status `pending` until first deployment)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      function:
                        $ref: '#/components/schemas/Function'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account not funded — Functions unlock after the first top-up of $5 or more
        '409':
          description: A function with this name already exists in the account

  /api/v1/functions/usage:
    get:
      tags:
        - Functions
      summary: Get usage & estimated charge
      description: |
        Current calendar-month usage across the account's two paid meters
        (memory GB-seconds and active-CPU vCPU-seconds), the monthly free
        tier remaining, AI Lambda-conversions used, and the estimated charge
        month-to-date (only usage beyond the free tier bills). Requests and
        egress are free and never metered for billing.
      operationId: getFunctionsUsage
      parameters:
        - name: function_id
          in: query
          description: Scope to one function (pre-free-tier view; the free tier is account-wide)
          schema:
            type: string
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FunctionsUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/functions/spend-settings:
    get:
      tags:
        - Functions
      summary: Get spend cap settings
      description: |
        The monthly spend cap is ON by default ($50/month). At the cap your
        functions pause — they stop serving instead of charging you — and
        resume automatically next month or when you raise the cap.
      operationId: getFunctionsSpendSettings
      responses:
        '200':
          description: Spend cap settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      settings:
                        $ref: '#/components/schemas/FunctionsSpendSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Functions
      summary: Update spend cap settings
      operationId: updateFunctionsSpendSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                monthly_cap_usd:
                  type: number
                  description: Monthly maximum in USD (0–1,000,000)
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      settings:
                        $ref: '#/components/schemas/FunctionsSpendSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/functions/import/lambda:
    post:
      tags:
        - Functions
      summary: Convert AWS Lambda source
      description: |
        Convert AWS Lambda handler code to a Raff function. Stateless —
        nothing is stored; review the output, then create a function and
        deploy the returned files.

        Two modes:

        - `rewrite` (default) — AI rewrites the handler to a portable
          standard handler (FastAPI / Web Fetch / net/http). Every guess is
          flagged in `warnings`. 5 free per calendar month, then $0.30 per
          conversion from your balance. Up to 64KB of source.
        - `adapter` — your code ships unchanged plus a small static shim that
          presents API-Gateway-style events. Instant, free, unlimited.

        Config always maps deterministically: memory/timeout, env vars to
        `raff_toml`, EventBridge `rate()` schedules to cron trigger
        proposals. IAM, VPC, layers and stream sources are listed in
        `out_of_scope` with alternatives.
      operationId: convertLambda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertLambdaRequest'
      responses:
        '200':
          description: Conversion result (review before deploying)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ConvertLambdaResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: AI rewrite requires a funded account (adapter mode works without)

  /api/v1/functions/{function_id}:
    get:
      tags:
        - Functions
      summary: Get function
      description: Fetch one function by ID, URL slug, or name.
      operationId: getFunction
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      responses:
        '200':
          description: Function details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      function:
                        $ref: '#/components/schemas/Function'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Functions
      summary: Update function settings
      description: |
        Partially update runtime settings (memory, timeout, extended
        timeout, scale bounds, description). When the function is live the
        change rolls out as a new revision with zero downtime.
      operationId: updateFunction
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFunctionRequest'
      responses:
        '200':
          description: Updated function
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      function:
                        $ref: '#/components/schemas/Function'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Functions
      summary: Delete function
      description: |
        Delete a function and all its revisions. Deletion is asynchronous;
        the function's name and URL are released once it completes.
      operationId: deleteFunction
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      responses:
        '200':
          description: Deletion accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/pause:
    post:
      tags:
        - Functions
      summary: Pause function
      description: Stop serving traffic. The image and revisions are kept; resume any time.
      operationId: pauseFunction
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      responses:
        '200':
          description: Function paused
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/resume:
    post:
      tags:
        - Functions
      summary: Resume function
      description: Re-deploy the current revision and start serving again.
      operationId: resumeFunction
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      responses:
        '200':
          description: Function resuming (status `building` until live)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/source-upload:
    post:
      tags:
        - Functions
      summary: Request source upload URL
      description: |
        Returns a presigned URL to PUT a source zip (max 100MB). After
        uploading, start a deployment with the returned `source_blob_key`.
      operationId: requestFunctionSourceUpload
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      responses:
        '200':
          description: Presigned upload slot
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FunctionSourceUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/deployments:
    get:
      tags:
        - Functions
      summary: List deployments
      operationId: listFunctionDeployments
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      responses:
        '200':
          description: Deployments, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deployments:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionDeployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Functions
      summary: Create deployment
      description: |
        Build and roll out new source. Provide exactly one source:

        - `source_blob_key` — from a completed source upload
        - `template` — a starter template id (`python`, `typescript`, `node`, `go`)
        - `files` — inline source files (small console edits)

        Functions connected to GitHub deploy their branch head when no
        source is given. Buildpacks detect the language; a `Dockerfile` at
        the source root switches to a container build. The container must
        listen on the `PORT` environment variable.
      operationId: createFunctionDeployment
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionDeploymentRequest'
      responses:
        '201':
          description: Deployment queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deployment:
                        $ref: '#/components/schemas/FunctionDeployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/deployments/{deployment_id}:
    get:
      tags:
        - Functions
      summary: Get deployment
      operationId: getFunctionDeployment
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deployment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deployment:
                        $ref: '#/components/schemas/FunctionDeployment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/deployments/{deployment_id}/logs:
    get:
      tags:
        - Functions
      summary: Get build logs
      operationId: getFunctionDeploymentLogs
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: deployment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Build log lines (poll until `complete`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      lines:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionBuildLogLine'
                      complete:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/functions/{function_id}/revisions:
    get:
      tags:
        - Functions
      summary: List revisions
      description: Immutable deploy history. Roll back to any revision instantly — revisions are free.
      operationId: listFunctionRevisions
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      responses:
        '200':
          description: Revisions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      revisions:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionRevision'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/functions/{function_id}/rollback:
    post:
      tags:
        - Functions
      summary: Roll back to a revision
      description: Re-deploys the target revision's image — no rebuild, zero downtime.
      operationId: rollbackFunction
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision_id]
              properties:
                revision_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Rollback deployment queued
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/source:
    get:
      tags:
        - Functions
      summary: Get revision source
      description: Download URL (and inline files for small sources) of a revision's source zip.
      operationId: getFunctionSource
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: revision_id
          in: query
          description: Defaults to the current revision
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Source download
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      download_url:
                        type: string
                      files:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionSourceFile'
                      inline_truncated:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/logs:
    get:
      tags:
        - Functions
      summary: Get runtime logs
      description: Stdout/stderr of the running function (14-day retention, included free).
      operationId: listFunctionLogs
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: since
          in: query
          description: RFC3339 start time (default one hour ago)
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: level
          in: query
          schema:
            type: string
            enum: [info, warn, error, debug]
        - name: q
          in: query
          description: Substring filter
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
            maximum: 1000
      responses:
        '200':
          description: Log lines, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      lines:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionLogLine'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/functions/{function_id}/metrics:
    get:
      tags:
        - Functions
      summary: Get metrics
      description: Invocations, latency percentiles and error rate (included free).
      operationId: getFunctionMetrics
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: window
          in: query
          schema:
            type: string
            enum: [1h, 24h, 7d]
            default: 1h
      responses:
        '200':
          description: Metric series + summary numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/FunctionMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/functions/{function_id}/invocations:
    get:
      tags:
        - Functions
      summary: List recent invocations
      operationId: listFunctionInvocations
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent requests, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      invocations:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionInvocation'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/functions/{function_id}/env:
    get:
      tags:
        - Functions
      summary: List environment variables
      description: Secret values are masked; use the reveal endpoint to read them.
      operationId: listFunctionEnvVars
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      responses:
        '200':
          description: Environment variables
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      env_vars:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionEnvVar'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Functions
      summary: Set environment variable
      description: |
        Create or update one variable. Live functions roll the change out as
        a new revision with zero downtime. Keys prefixed `PORT`, `K_` or
        `RAFF_` are reserved.
      operationId: setFunctionEnvVar
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                value:
                  type: string
                is_secret:
                  type: boolean
      responses:
        '200':
          description: Variable set (response includes the config redeploy when one was started)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/functions/{function_id}/env/reveal:
    get:
      tags:
        - Functions
      summary: List environment variables with values
      description: Returns secret values in cleartext. Requires manage permission; access is audited.
      operationId: revealFunctionEnvVars
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      responses:
        '200':
          description: Environment variables with values
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      env_vars:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionEnvVar'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/functions/{function_id}/env/{key}:
    delete:
      tags:
        - Functions
      summary: Delete environment variable
      operationId: deleteFunctionEnvVar
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Variable deleted (config redeploy rolls it out when live)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/triggers:
    get:
      tags:
        - Functions
      summary: List triggers
      operationId: listFunctionTriggers
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      responses:
        '200':
          description: Triggers (HTTP is always on and not listed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      triggers:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionTrigger'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Functions
      summary: Create trigger
      description: |
        Schedule or subscribe the function. `cron` uses a 5-field expression
        with an optional IANA `timezone`; `once` fires a single time at
        `run_at`; `s3` fires on Object Storage bucket events (optionally
        filtered by key prefix/suffix). Deliveries are signed CloudEvents
        (HMAC `X-Raff-Signature`) with 3 retry attempts. Triggers are free.
      operationId: createFunctionTrigger
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionTriggerRequest'
      responses:
        '201':
          description: Trigger created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      trigger:
                        $ref: '#/components/schemas/FunctionTrigger'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/functions/{function_id}/triggers/{trigger_id}:
    patch:
      tags:
        - Functions
      summary: Update trigger
      operationId: updateFunctionTrigger
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: trigger_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                cron_expression:
                  type: string
                timezone:
                  type: string
                run_at:
                  type: string
                  format: date-time
                payload_json:
                  type: string
      responses:
        '200':
          description: Trigger updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Functions
      summary: Delete trigger
      operationId: deleteFunctionTrigger
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: trigger_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trigger deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/bindings:
    get:
      tags:
        - Functions
      summary: List bindings
      operationId: listFunctionBindings
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      responses:
        '200':
          description: Bindings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      bindings:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionBinding'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Functions
      summary: Create binding
      description: |
        Wire a Raff-managed resource into the function. A binding mints a
        scoped credential (its own database role / S3 key — independent of the
        resource's main credentials) and injects it as read-only system env
        vars (`{PREFIX}_URL`, `{PREFIX}_HOST`, … for databases;
        `{PREFIX}_ENDPOINT`, `{PREFIX}_ACCESS_KEY`, … for buckets). Database
        bindings connect over Raff's private service fabric — traffic never
        leaves the platform network. Live functions roll a zero-downtime
        config redeploy.
      operationId: createFunctionBinding
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFunctionBindingRequest'
      responses:
        '200':
          description: Binding created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      binding:
                        $ref: '#/components/schemas/FunctionBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/functions/{function_id}/bindings/{binding_id}:
    delete:
      tags:
        - Functions
      summary: Delete binding
      description: Revokes the scoped credential and removes its env vars.
      operationId: deleteFunctionBinding
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: binding_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Binding deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/bindings/{binding_id}/rotate:
    post:
      tags:
        - Functions
      summary: Rotate binding credentials
      description: |
        Mints a fresh credential and refreshes the injected env vars; the old
        credential stops working immediately. Zero-downtime redeploy.
      operationId: rotateFunctionBinding
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: binding_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      binding:
                        $ref: '#/components/schemas/FunctionBinding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/functions/{function_id}/trigger-runs:
    get:
      tags:
        - Functions
      summary: List trigger runs
      description: Delivery history for the function's triggers (30-day retention).
      operationId: listFunctionTriggerRuns
      parameters:
        - $ref: '#/components/parameters/FunctionRef'
        - name: trigger_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      runs:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionTriggerRun'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/public/functions/runtimes:
    get:
      tags:
        - Functions
      summary: List runtimes (public)
      description: The managed runtime catalog. No authentication required.
      operationId: listFunctionRuntimes
      security: []
      responses:
        '200':
          description: Available runtimes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      runtimes:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionRuntimeInfo'

  /api/v1/public/pricing/functions:
    get:
      tags:
        - Functions
      summary: Get Functions pricing (public)
      description: |
        Two paid meters — memory (GB-seconds, wall-clock) and active CPU
        (vCPU-seconds) — plus the monthly account-wide free tier. Requests,
        egress, scheduling, logs and metrics are free. No authentication
        required.
      operationId: getFunctionsPricing
      security: []
      responses:
        '200':
          description: Active pricing
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      pricing:
                        type: array
                        items:
                          $ref: '#/components/schemas/FunctionsPricing'

  /api/v1/apps/tiers:
    get:
      tags:
        - Raff Apps
      summary: List Apps tiers
      description: The Apps pricing catalog — compute sizes and prices. No authentication required.
      operationId: listAppTiers
      security: []
      parameters:
        - name: region
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Available tiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tiers:
                    type: array
                    items:
