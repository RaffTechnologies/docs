  /api/v1/backups/{id}/restore:
    post:
      tags:
        - Backups
      summary: Restore backup
      description: |
        Restore a VM from a backup. The restore runs asynchronously — the response returns immediately with a `pending` status.

        The target VM is overwritten in place. The VM should be powered off before restoring.
      operationId: restoreBackup
      parameters:
        - name: id
          in: path
          required: true
          description: Backup ID (UUID)
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '202':
          description: Backup restore accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Backup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/backups/{id}/chain:
    delete:
      tags:
        - Backups
      summary: Delete backup series
      description: |
        Delete an entire backup series — every restore point that the given backup
        belongs to. The series is identified by passing the UUID of **any** backup
        row in it; all sibling restore points (and the underlying storage) are
        removed in one call.

        Use this when a single restore point can't be removed on its own because
        it has older restore points it depends on. The single-backup
        [Delete backup](/api-reference/virtual-machines/delete-backup) endpoint
        returns a clear error in that case and points here.
      operationId: deleteBackupChain
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of any backup row in the series to remove.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '200':
          description: Backup series deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/vms/{id}/backups/reset-chain:
    post:
      tags:
        - Backups
      summary: Reset backup series
      description: |
        Start a fresh backup series for the VM. The current series is closed —
        existing restore points remain restorable until you delete them — and
        the next backup creates a new independent baseline.

        Use when a series has grown long and you want a clean baseline for
        future backups without losing the restore points you already have.
      operationId: resetBackupChain
      parameters:
        - name: id
          in: path
          required: true
          description: VM UUID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/ProjectIDHeader'
      responses:
        '202':
          description: New baseline queued — the next backup will start a fresh series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

