      operationId: requestAppSourceUpload
      parameters:
        - $ref: '#/components/parameters/AppServiceRef'
      responses:
        '200':
          description: Presigned upload slot
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  upload_url:
                    type: string
                  blob_key:
                    type: string
                  expires_in_seconds:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/apps/services/{service_id}/deployments:
    get:
      tags:
        - Raff Apps
      summary: List deployments
      operationId: listAppDeployments
      parameters:
        - $ref: '#/components/parameters/AppServiceRef'
        - name: limit
