      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
          description: Short reference id used in URLs
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name, unique within the project
        slug:
          type: string
          description: URL label — the name plus a short random suffix
        description:
          type: string
        service_type:
          type: string
          enum: [web, private, worker, cron, job]
        source_type:
          type: string
          enum: [git, image, template, compose]
        builder:
          type: string
          enum: [buildpacks, dockerfile, image]
        repo_full_name:
          type: string
          description: GitHub source only (owner/name)
        repo_branch:
          type: string
        repo_root_dir:
          type: string
        dockerfile_path:
