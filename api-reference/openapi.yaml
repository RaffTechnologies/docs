          format: date-time

    AddMemberRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email to invite. Mutually exclusive with `target_user_id` and `api_key_id`.
        target_user_id:
          type: string
          format: uuid
          description: User UUID to add directly. The user must already exist on Raff (e.g. an existing project-only member). Mutually exclusive with `email` and `api_key_id`.
        api_key_id:
          type: string
          format: uuid
          description: API key UUID to grant account-level access via this membership. Mutually exclusive with `email` and `target_user_id`.
        role_id:
          type: string
          format: uuid
          description: Role UUID. Required.

    UpdateMemberRequest:
      type: object
      description: At least one field is required.
      properties:
        role_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, suspended]
          description: Set `active` to re-enable a suspended member, or `suspended` to disable. `pending` cannot be set directly — that's reserved for invitation flow.

    ProjectMember:
      type: object
      required:
        - id
        - email
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Project member ID
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          format: email
        role:
          type: string
          description: Role slug (deprecated — prefer `role_id` and `role_name`)
        role_id:
          type: string
          format: uuid
        role_name:
          type: string
        status:
          type: string
          enum: [pending, active, suspended]
          description: |
            Membership status:
            - `pending` — invited but not yet accepted
            - `active` — full member
            - `suspended` — temporarily disabled by an admin
        invited_by:
          type: string
          format: uuid
        invited_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        invitation_id:
          type: string
          format: uuid
        invitation_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    AddProjectMemberRequest:
      type: object
      required:
        - role_id
      properties:
        target_user_id:
          type: string
          format: uuid
          description: User UUID to add. Must already be an account member. Mutually exclusive with `api_key_id`.
        api_key_id:
          type: string
          format: uuid
          description: API key UUID to grant access to this project. Mutually exclusive with `target_user_id`.
        role_id:
          type: string
          format: uuid

    Role:
      type: object
      required:
        - id
        - name
        - slug
        - scope
        - permissions
        - is_system
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
          description: Empty for built-in system roles
        name:
          type: string
          example: Operator
        slug:
          type: string
          example: operator
        description:
          type: string
        scope:
          type: string
          enum: [account, project]
          description: Whether the role grants account-level or project-level permissions
        permissions:
          type: array
          items:
            type: string
          description: Permission strings (e.g. `vm.create`, `project.members.view`). See [List Permissions](#tag/Permissions/operation/listPermissions).
        is_system:
          type: boolean
          description: '`true` for built-in roles (Owner, Admin, Member, Operator, etc.) which cannot be edited or deleted. `false` for custom roles.'
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required:
        - name
        - slug
        - scope
        - permissions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: Custom Operator
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          maxLength: 64
          example: custom-operator
        description:
          type: string
        scope:
          type: string
          enum: [account, project]
        permissions:
          type: array
          items:
            type: string
          minItems: 1
          example: [vm.view, vm.create, volume.view]

    UpdateRoleRequest:
      type: object
      description: At least one field is required. Slug and scope cannot be changed after creation.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    Permission:
      type: object
      required:
        - name
        - scope
        - category
      properties:
        name:
          type: string
          example: vm.create
        description:
          type: string
          example: Create new virtual machines
        scope:
          type: string
          enum: [account, project]
        category:
          type: string
          example: vm

    APIKeyProjectAccess:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        project_name:
          type: string
        role_id:
          type: string
          format: uuid
        role_name:
          type: string
        role_slug:
          type: string

    APIKey:
      type: object
      required:
        - id
        - name
        - key_prefix
        - is_active
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          description: First 13 characters of the key — the `raff_` prefix plus the first 8 hex characters (e.g. `raff_17d70fcf`). The full secret is only returned once at create or regenerate time.
          example: raff_17d70fcf
        scope:
          type: string
          enum: [public]
          description: Always `public` for customer-created keys
        rate_limit_tier:
          type: string
          enum: [standard, high]
          description: Rate-limit tier. Standard is 30 RPS / burst 60; High is 100 RPS / burst 200.
        expires_at:
          type: string
          format: date-time
          description: When the key auto-expires. Omitted for never-expires keys.
        last_used_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        role_id:
          type: string
          format: uuid
          description: Account-level role this key uses
        role_name:
          type: string
        role_slug:
          type: string
        project_accesses:
          type: array
          items:
            $ref: '#/components/schemas/APIKeyProjectAccess'
          description: Per-project access grants
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    APIKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required:
            - secret
          properties:
            secret:
              type: string
              description: |
                The full API key. **Returned only once** — at create or regenerate time. Store immediately; the secret cannot be retrieved later.
              example: raff_17d70fcf7e7510968a4c19279b25707f088f1cc5ad8b74210341d8e470b5bb7a

    CreateAPIKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: A descriptive label for the key (e.g. `Production CI`, `Backups Lambda`)
        rate_limit_tier:
          type: string
          enum: [standard, high]
          default: standard
          description: '`standard` (30 RPS) by default. `high` (100 RPS) requires support approval — request via email if you need it.'
        expires_at:
          type: string
          format: date-time
          description: Optional expiration timestamp. Omit for never-expires keys.
        role_id:
          type: string
          format: uuid
          description: Account-level role to assign. The key inherits this role's `account.*` permissions. To grant per-project access, add the key as a Project Member after creation.

    UpdateAPIKeyRequest:
      type: object
      description: At least one field is required. To change the role, rotate to a new key — role at create time is frozen.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        rate_limit_tier:
          type: string
          enum: [standard, high]
        expires_at:
          type: string
          format: date-time
        is_active:
          type: boolean

    Invitation:
      type: object
      required:
        - id
        - type
        - email
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [account, project]
          description: Account-level or project-level invitation
        account_id:
          type: string
          format: uuid
        account_name:
          type: string
        project_id:
          type: string
          format: uuid
          description: Set only when `type` is `project`
        project_name:
          type: string
        email:
          type: string
          format: email
        role_id:
          type: string
          format: uuid
        role_name:
          type: string
        invited_by_id:
          type: string
          format: uuid
        invited_by_email:
          type: string
          format: email
        invited_by_name:
          type: string
        expires_at:
          type: string
          format: date-time
          description: When the invitation auto-expires. Past this time, the accept link returns an error and the row is removed by a cleanup job.
        created_at:
          type: string
          format: date-time

    CreateInvitationRequest:
      type: object
      required:
        - email
        - role_id
      properties:
        email:
          type: string
          format: email
          description: Recipient's email address. Must not already be a member.
        role_id:
          type: string
          format: uuid
          description: 'Role the invitee will receive on acceptance. Must be `scope: account` for account invites or `scope: project` for project invites.'

    Function:
      type: object
      description: A serverless function. Handlers are standard (ASGI / Web Fetch / net/http / any container listening on $PORT) — nothing Raff-specific.
      properties:
        id:
          type: string
          format: uuid
        function_id:
          type: string
          description: Short reference id, e.g. `fn-a1b2c3d4`
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name, unique within the account
        slug:
          type: string
          description: URL label — the name plus a short random suffix (never collides across accounts)
        description:
          type: string
        runtime:
          type: string
          enum: [python, node, go, docker]
        handler_kind:
          type: string
          description: "`asgi`, `fetch`, `net_http` or `container`"
        region:
          type: string
          enum: [us-east]
        memory_mb:
          type: integer
          description: "One of: 128, 256, 512, 1024, 2048, 4096"
        timeout_seconds:
          type: integer
          description: Up to 3600, or 86400 with `extended_timeout`
        extended_timeout:
          type: boolean
        min_scale:
          type: integer
          description: 0 = scale to zero (idle bills nothing); ≥1 keeps warm instances at 30% of the memory rate
        max_scale:
          type: integer
        source_type:
          type: string
          enum: [console, cli, github]
        repo_full_name:
          type: string
          description: GitHub source only
        repo_branch:
          type: string
        repo_root_dir:
          type: string
        url:
          type: string
          description: "`https://{slug}.fn.raffusercloud.com` — HTTPS with automatic TLS"
        status:
          type: string
          enum: [pending, building, live, paused, error, deleting]
        status_message:
          type: string
        current_revision_number:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateFunctionRequest:
      type: object
      required: [name, runtime]
      properties:
        name:
          type: string
        slug:
          type: string
          description: Optional URL label base (a random suffix is always appended)
        description:
          type: string
        runtime:
          type: string
          enum: [python, node, go, docker]
        region:
          type: string
          enum: [us-east]
        memory_mb:
          type: integer
          default: 256
        timeout_seconds:
          type: integer
          default: 300
        extended_timeout:
          type: boolean
          description: Allow timeouts up to 86400s (24h)
        min_scale:
          type: integer
          default: 0
        max_scale:
          type: integer
          default: 20
        source_type:
          type: string
          enum: [console, cli, github]

    UpdateFunctionRequest:
      type: object
      description: All fields optional — only provided fields change.
      properties:
        description:
          type: string
        memory_mb:
          type: integer
        timeout_seconds:
          type: integer
        extended_timeout:
          type: boolean
        min_scale:
          type: integer
        max_scale:
          type: integer

    FunctionDeployment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        revision_id:
          type: string
          format: uuid
          description: Set when the deployment succeeds
        channel:
          type: string
          enum: [console, cli, github]
        status:
          type: string
          enum: [queued, building, deploying, ready, failed]
        commit_sha:
          type: string
        error:
          type: string
        build_duration_ms:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateFunctionDeploymentRequest:
      type: object
      properties:
        channel:
          type: string
          enum: [console, cli]
        source_blob_key:
          type: string
          description: From a completed source upload
        template:
          type: string
          enum: [python, typescript, node, go]
          description: Deploy a starter template instead of uploaded source
        files:
          type: array
          description: Inline source files (small edits)
          items:
            $ref: '#/components/schemas/FunctionSourceFile'
        message:
          type: string

    FunctionRevision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        revision_number:
          type: integer
        commit_sha:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [active, superseded, failed]
        is_current:
          type: boolean
        created_at:
          type: string
          format: date-time

    FunctionSourceUpload:
      type: object
      properties:
        upload_url:
          type: string
          description: Presigned URL — PUT the zip here (Content-Type application/zip)
        source_blob_key:
          type: string
        expires_in_seconds:
          type: integer

    FunctionSourceFile:
      type: object
      required: [name, content]
      properties:
        name:
          type: string
        content:
          type: string

    FunctionBuildLogLine:
      type: object
      properties:
        timestamp:
          type: string
        step:
          type: string
        message:
          type: string

    FunctionLogLine:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [info, warn, error, debug]
        message:
          type: string
        stream:
          type: string
          enum: [stdout, stderr]

    FunctionMetrics:
      type: object
      properties:
        series:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                enum: [invocations, p50_ms, p95_ms, errors]
              points:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    value:
                      type: number
        invocations_total:
          type: integer
        error_rate_pct:
          type: number
        p50_ms:
          type: number
        p95_ms:
          type: number

    FunctionInvocation:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        method:
          type: string
        path:
          type: string
        status:
          type: integer
        duration_ms:
          type: number

    FunctionsUsage:
      type: object
      properties:
        memory_gb_seconds:
          type: number
        warm_gb_seconds:
          type: number
        cpu_seconds:
          type: number
        request_count:
          type: integer
          description: Informational — requests are free
        free_gb_seconds_remaining:
          type: number
        free_vcpu_seconds_remaining:
          type: number
        estimated_cost_usd:
          type: number
          description: Month-to-date, after the free tier
        ai_conversions:
          type: integer
          description: AI Lambda-rewrites used this calendar month
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        as_of:
          type: string
          format: date-time
          description: Metering watermark (near-real-time)

    FunctionsSpendSettings:
      type: object
      properties:
        enabled:
          type: boolean
        monthly_cap_usd:
          type: number
        cap_action:
          type: string
          enum: [pause]
        paused_by_cap:
          type: boolean

    FunctionTrigger:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trigger_type:
          type: string
          enum: [cron, once, s3]
        enabled:
          type: boolean
        cron_expression:
          type: string
        timezone:
          type: string
        run_at:
          type: string
          format: date-time
        next_run_at:
          type: string
          format: date-time
        payload_json:
          type: string
        bucket_id:
          type: string
          format: uuid
          description: Source bucket (`s3` type)
        s3_events:
          type: array
          items:
            type: string
          description: "Subscribed events, e.g. s3:ObjectCreated:*, s3:ObjectRemoved:*"
        key_prefix:
          type: string
        key_suffix:
          type: string
        last_run_at:
          type: string
          format: date-time
        last_status:
          type: string
          enum: [ok, failed, '']
        created_at:
          type: string
          format: date-time

    CreateFunctionTriggerRequest:
      type: object
      required: [trigger_type]
      properties:
        trigger_type:
          type: string
          enum: [cron, once, s3]
        cron_expression:
          type: string
          description: 5-field cron (required for `cron`)
        timezone:
          type: string
          description: IANA name, default UTC
        run_at:
          type: string
          format: date-time
          description: Required for `once`
        payload_json:
          type: string
          description: JSON merged into the CloudEvent data (cron/once)
        bucket_id:
          type: string
          format: uuid
          description: Required for `s3` — an Object Storage bucket you own
        s3_events:
          type: array
          items:
            type: string
          description: "Default s3:ObjectCreated:*; also s3:ObjectRemoved:*"
        key_prefix:
          type: string
          description: Only objects whose key starts with this fire the trigger
        key_suffix:
          type: string
          description: Only objects whose key ends with this fire the trigger

    FunctionTriggerRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trigger_id:
          type: string
          format: uuid
        scheduled_for:
          type: string
          format: date-time
        status:
          type: string
          enum: [dispatching, ok, failed]
        attempts:
          type: integer
        response_status:
          type: integer
        duration_ms:
          type: integer
        error:
          type: string
        finished_at:
          type: string
          format: date-time

    FunctionEnvVar:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
          description: Empty for secrets unless fetched via the reveal endpoint
        is_secret:
          type: boolean
        is_system:
          type: boolean
          description: Managed by the platform (e.g. bindings) — read-only
        binding_id:
          type: string
          format: uuid
          description: Owning binding for system vars
        updated_at:
          type: string
          format: date-time

    FunctionBinding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        binding_type:
          type: string
          enum: [database, bucket]
        resource_id:
          type: string
          format: uuid
        resource_name:
          type: string
        env_prefix:
          type: string
        injected_keys:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [provisioning, active, rotating, error, deleting]
        status_message:
          type: string
        created_at:
          type: string
          format: date-time

    CreateFunctionBindingRequest:
      type: object
      required: [binding_type, resource_id]
      properties:
        binding_type:
          type: string
          enum: [database, bucket]
        resource_id:
          type: string
          format: uuid
          description: A managed database or Object Storage bucket you own
        env_prefix:
          type: string
          description: Env key prefix (default DATABASE / STORAGE)

    ConvertLambdaRequest:
      type: object
      required: [lambda_runtime, files]
