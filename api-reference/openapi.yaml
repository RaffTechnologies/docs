    Database:
      type: object
      description: |
        A managed database instance. The private endpoint `{database_id}.db.raffusercloud.com` lives inside the attached VPC; public access is optional. TLS is always required.
      properties:
        id:
          type: string
          format: uuid
          description: Unique database identifier
        database_id:
          type: string
          description: Short reference id used in URLs and DNS hostnames, e.g. `a1b2c3d4`
        project_id:
          type: string
          format: uuid
          description: Project this database belongs to
        name:
          type: string
          description: Display name
          example: orders-db
        engine:
          $ref: '#/components/schemas/DatabaseEngine'
        engine_version:
          type: string
          description: Engine major version
          example: "16"
        status:
          type: string
          enum: [pending, deploying, running, warning, suspended, failed, deleting, deleted]
          description: |
            Lifecycle status. Creation: `pending` → `deploying` → `running`. `warning` means running with a degraded component; `suspended` means a free-tier database paused for idleness (resume any time — data is kept); `failed` means provisioning or a scale operation failed.
        status_message:
          type: string
          description: Human-readable detail for `warning` and `failed` states
        region:
          type: string
          enum: [us-east]
          description: Data center region
          example: us-east
        plan_id:
          type: integer
          description: Pricing plan ID (see `GET /api/v1/databases/plans`)
          example: 5
        storage_gb:
          type: integer
          description: Provisioned storage in GB. Storage above the plan's included allotment bills at $0.12/GB/month.
          example: 25
        ha_enabled:
          type: boolean
          description: |
            High availability — a standby that takes over automatically on failure (Sentinel failover for Valkey). Adds 70% of the plan price.
        replica_count:
          type: integer
          description: Number of read replicas (PostgreSQL only; always 0 for Valkey)
          example: 0
        vpc_id:
          type: string
          format: uuid
          description: VPC the private endpoint is attached to (empty if not yet connected)
        public_access:
          type: boolean
          description: Whether public access is enabled
        connection_host:
          type: string
          description: Private endpoint hostname, resolvable inside the attached VPC
          example: a1b2c3d4.db.raffusercloud.com
        connection_port:
          type: integer
          description: "Private endpoint port. PostgreSQL: 6432 pooled (PgBouncer, transaction mode), 5432 direct. Valkey: 6379 (TLS)."
          example: 6432
        billing_type:
          type: string
          enum: [payg, subscription]
          description: Billing type for this database
          example: payg
        subscription_id:
          type: string
          format: uuid
          description: Subscription ID if billing_type is subscription
        price_per_hour:
          type: number
          description: Hourly billing rate in USD
          example: 0.010945
        monthly_price:
          type: number
          description: Monthly price in USD
          example: 7.99
        public_port:
          type: integer
          description: |
            Public port from the reserved range 25060–26060; `0` when public access is off. For PostgreSQL, `public_port` is the pooled endpoint and `public_port + 1` is the direct endpoint.
          example: 25060
        public_dns_hostname:
          type: string
          description: Public endpoint hostname (empty when public access is off)
          example: a1b2c3d4.public.db.raffusercloud.com
        public_allowlist:
          type: array
          items:
            type: string
          description: Source CIDRs allowed on the public endpoint. Empty = allow all sources.
          example: ["203.0.113.0/24"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDatabaseRequest:
      type: object
      required:
        - name
        - plan_id
      properties:
        name:
          type: string
          description: Display name, unique within the account
          example: orders-db
        engine:
          $ref: '#/components/schemas/DatabaseEngine'
        engine_version:
          type: string
          description: Engine major version from the engine catalog. Omit for the default version.
          example: "16"
        plan_id:
          type: integer
          description: Pricing plan ID from `GET /api/v1/databases/plans`
          example: 5
        storage_gb:
          type: integer
          description: Storage in GB. Omit to use the plan's included allotment; storage above it bills at $0.12/GB/month.
        ha_enabled:
          type: boolean
          default: false
          description: Enable high availability (+70% of the plan price)
        replica_count:
          type: integer
          default: 0
          description: Read replicas (PostgreSQL only; Valkey rejects a count above 0)
        region:
          type: string
          enum: [us-east]
          default: us-east
          description: Data center region
        vpc_id:
          type: string
          format: uuid
          description: VPC to place the private endpoint in. Omit to create without VPC connectivity and attach one later via `POST /api/v1/databases/{database_id}/vpc`.
        public_access:
          type: boolean
          default: false
          description: Enable public access at create time
        engine_config:
          type: object
          additionalProperties:
            type: string
          description: Engine configuration overrides (allowlisted keys only)

    UpdateDatabaseRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: New display name
          example: orders-db-v2

    ScaleDatabaseRequest:
      type: object
      properties:
        plan_id:
          type: integer
          description: New plan ID (same engine). Omit or `0` to keep the current plan.
        storage_gb:
          type: integer
          description: New storage size in GB. Grows only — never below the plan's included allotment. Omit or `0` to keep the current size.
        set_ha:
          type: boolean
          default: false
          description: Set to `true` to apply the `has_ha` value. When `false` or omitted, high availability is unchanged.
        has_ha:
          type: boolean
          description: Desired high availability state. Only applied when `set_ha` is `true`.
        replica_count:
          type: integer
          description: Desired read replica count. Always applied — pass your current count when not changing it. PostgreSQL only.

    ConnectDatabaseVPCRequest:
      type: object
      required:
        - vpc_id
      properties:
        vpc_id:
          type: string
          format: uuid
          description: VPC to attach the database's private endpoint to

    DatabasePublicAccessRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Enable or disable public access
        allowlist:
          type: array
          items:
            type: string
          description: Source CIDRs allowed to connect. Omit to keep the stored list; pass `[]` to allow all sources.
          example: ["203.0.113.0/24"]

    SetDatabaseExtensionRequest:
      type: object
      required:
        - name
        - enabled
      properties:
        name:
          type: string
          description: Extension name from the allowlist (see `GET /api/v1/databases/{database_id}/extensions`)
          example: pgvector
        enabled:
          type: boolean
          description: "`true` to install, `false` to remove"

    RestoreDatabaseRequest:
      type: object
      required:
        - clone_to_new
      properties:
        clone_to_new:
          type: boolean
          description: Must be `true` — restores always create a new database; in-place restore is not supported
        backup_id:
          type: string
          format: uuid
          description: Restore from this completed backup. Omit to use `pitr_timestamp` or the latest state.
        pitr_timestamp:
          type: string
          format: date-time
          description: Point-in-time restore target (RFC 3339). PostgreSQL only — Valkey restores from snapshots via `backup_id`.
        new_name:
          type: string
          description: Name for the new database. Defaults to `{source-name}-restored`; auto-suffixed (`-2`, `-3`, …) if taken.
        ha_enabled:
          type: boolean
          default: false
          description: Enable high availability on the new database (+70% of the plan price). Never inherited from the source.

    DatabaseConnection:
      type: object
      properties:
        host:
          type: string
          description: Endpoint hostname
          example: a1b2c3d4.db.raffusercloud.com
        port:
          type: integer
          description: Endpoint port
          example: 6432
        username:
          type: string
          description: Database user
        password:
          type: string
          description: Password — empty unless the request was made with `reveal=true`
        database_name:
          type: string
          description: Default database name
        connection_uri:
          type: string
          description: Ready-to-use connection URI (includes the password only when revealed)
        ca_cert:
          type: string
          description: >-
            PEM CA bundle your client must trust, for engines whose certificates
            come from a private CA (currently Kafka). Empty for other engines.

    DatabaseMetrics:
      type: object
      description: Latest usage snapshot, refreshed about every 60 seconds. Zero values mean not measured yet.
      properties:
        cpu_used_millicores:
          type: integer
          description: CPU in use, millicores
        cpu_capacity_millicores:
          type: integer
          description: CPU capacity, millicores
        mem_used_bytes:
          type: integer
          description: Memory in use, bytes
        mem_capacity_bytes:
          type: integer
          description: Memory capacity, bytes
        storage_used_bytes:
          type: integer
          description: Storage in use, bytes
        storage_capacity_bytes:
          type: integer
          description: Storage capacity, bytes
        connections_active:
          type: integer
          description: Active client connections
        connections_max:
          type: integer
          description: Connection limit
        replication_lag_bytes:
          type: integer
          description: Standby/replica lag in bytes (0 without HA or replicas)
        archive_lag_bytes:
          type: integer
          description: WAL archiving lag in bytes (PostgreSQL)
        metrics_updated_at:
          type: string
          format: date-time
          description: When this snapshot was taken

    DatabaseMetricsPoint:
      type: object
      description: One bucketed point in the metrics history.
      properties:
        recorded_at:
          type: string
          format: date-time
        cpu_used_millicores:
          type: integer
        cpu_capacity_millicores:
          type: integer
        mem_used_bytes:
          type: integer
        mem_capacity_bytes:
          type: integer
        storage_used_bytes:
          type: integer
        storage_capacity_bytes:
          type: integer
        connections_active:
          type: integer
        connections_max:
          type: integer
        replication_lag_bytes:
          type: integer
        archive_lag_bytes:
          type: integer

    DatabaseEngine:
      type: string
      enum: [postgres, mysql, valkey, clickhouse, kafka]
      description: >-
        Database engine identifier. Defaults to `postgres` on create; the live
        catalog (including availability and versions) is
        `GET /api/v1/databases/engines`.
      example: postgres

    DatabaseEngineInfo:
      type: object
      properties:
        engine:
          $ref: '#/components/schemas/DatabaseEngine'
        display_name:
          type: string
          example: PostgreSQL
        available:
          type: boolean
          description: Whether this engine can be created. MySQL is listed but not yet available.
        versions:
          type: array
          items:
            type: string
          description: Supported major versions
          example: ["16", "15"]

    DatabaseExtension:
      type: object
      description: A PostgreSQL extension from the allowlist.
      properties:
        name:
          type: string
          description: Extension name, used with `POST /api/v1/databases/{database_id}/extensions`
          example: pgvector
        display_name:
          type: string
        description:
          type: string
        installed:
          type: boolean
          description: Whether the extension is currently installed
        version:
          type: string
          description: Installed version (empty when not installed)

    DatabaseSlowQuery:
      type: object
      description: |
        One slow-query entry. PostgreSQL rows are `pg_stat_statements` aggregates per normalized query; Valkey rows are individual slow commands from `SLOWLOG` (`calls` is 1, `rows` is not applicable).
      properties:
        query:
          type: string
          description: Normalized query text (PostgreSQL) or the slow command (Valkey)
        calls:
          type: integer
          description: Number of executions aggregated into this entry
        mean_ms:
          type: number
          description: Mean execution time in milliseconds
        total_ms:
          type: number
          description: Total execution time in milliseconds
        rows:
          type: integer
          description: Total rows returned or affected (PostgreSQL)

    DatabaseBackup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Backup identifier — use as `backup_id` when restoring
        database_id:
          type: string
          format: uuid
          description: Database this backup belongs to
        backup_type:
          type: string
          enum: [base, on_demand]
          description: "`base` = nightly automatic backup; `on_demand` = manually requested"
        status:
          type: string
          enum: [running, completed, failed]
          description: Only `completed` backups are restorable
        size_bytes:
          type: integer
          description: Backup size in bytes (0 while running)
        s3_path:
          type: string
          description: Object storage location of the backup artifact
        backup_timestamp:
          type: string
          format: date-time
          description: Consistency point of the backup
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          description: When the backup leaves retention
          nullable: true

    
    K8sVersion:
      type: object
      properties:
        id:
          type: integer
          example: 1
        version:
          type: string
          example: v1.33+rke2r1
        display_name:
          type: string
          example: Kubernetes 1.33
        is_default:
          type: boolean

    K8sCluster:
      type: object
      required: [id, cluster_id, name, status, ready]
      properties:
        id:
          type: string
          format: uuid
          description: Internal UUID
        cluster_id:
          type: string
          description: Short cluster ID used in URLs and the API endpoint hostname
          example: q7z7zg
        name:
          type: string
          example: prod
        status:
          type: string
          enum: [pending, deploying, running, warning, failed, deleting, delete_failed, deleted]
          description: |
            - `pending` / `deploying` — provisioning
            - `running` — control plane up
            - `warning` — degraded (see `status_message`)
            - `failed` — provisioning failed; infrastructure was torn down (see `status_message`)
            - `deleting` — teardown in progress
            - `delete_failed` — teardown incomplete; nothing removed — retry the delete
        status_message:
          type: string
          description: Human-readable detail for warning/failed/delete_failed
        ready:
          type: boolean
          description: '`true` when the cluster is running and no node pool is mid-operation — safe to use without interpreting `status`'
        dns_domain:
          type: string
          example: q7z7zg.k8s.raffusercloud.com
        api_endpoint:
          type: string
          example: https://q7z7zg.k8s.raffusercloud.com:6443
        k8s_version:
          type: string
          example: v1.33.4+rke2r1
        k8s_version_id:
          type: integer
        region:
          type: string
          enum: [us-east]
        master_count:
          type: integer
          description: 1, or 3 with an HA control plane
        worker_count:
          type: integer
          description: Total worker nodes across all pools
        ha_enabled:
          type: boolean
        firewall_enabled:
          type: boolean
        longhorn_enabled:
          type: boolean
          description: >-
            Legacy clusters only — dedicated storage nodes with Longhorn block
            storage. Clusters created since August 26, 2026 use the
            `raff-block` StorageClass (PVCs become Volumes) and report false.
        traefik_enabled:
          type: boolean
        metallb_enabled:
          type: boolean
        billing_type:
          type: string
          enum: [payg, subscription]
        project_id:
          type: string
          format: uuid
        price_per_hour:
          type: number
          format: double
          description: Current hourly price (workers + HA fee; control plane is free, PVC storage bills separately per GB)
        price_per_month:
          type: number
          format: double
        vpc_id:
          type: string
          description: Dedicated VPC the cluster runs in
        private_vip:
          type: string
          description: Cluster gateway IP inside the VPC
          example: 10.1.0.254
        node_pools:
          type: array
          items:
            $ref: '#/components/schemas/K8sNodePool'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateK8sClusterRequest:
      type: object
      required: [name, node_pools]
      properties:
        name:
          type: string
          description: 1–63 lowercase letters, digits or hyphens; unique within the account
          example: prod
        k8s_version_id:
          type: integer
          description: From [List Kubernetes versions](#tag/Kubernetes/operation/listK8sVersions). Omit for the default version.
          example: 1
        node_pools:
          type: array
          minItems: 1
          description: At least one pool with at least 2 nodes in total. Pools may use different plans — each pool's nodes are sized and billed by its own plan.
          items:
            $ref: '#/components/schemas/K8sNodePoolInput'
        ha_enabled:
          type: boolean
          description: 3-master highly available control plane (flat monthly fee)
          default: false
        firewall_enabled:
          type: boolean
          description: Attach the platform baseline firewall to the public gateway
          default: true
        firewall_security_group_id:
          type: string
          format: uuid
          description: Use one of your security groups instead of the baseline
        storage_node_count:
          type: integer
          deprecated: true
          description: >-
            Removed August 26, 2026 — every cluster includes the `raff-block`
            default StorageClass: PersistentVolumeClaims are provisioned as
            Volumes and billed per GB. Any value other than 0 is rejected.
          default: 0
        storage_node_disk_gb:
          type: integer
          deprecated: true
          description: Removed August 26, 2026 together with `storage_node_count`.
        traefik_enabled:
          type: boolean
          description: Install the Traefik ingress controller
          default: false
        metallb_enabled:
          type: boolean
          description: Install MetalLB for `LoadBalancer` services
          default: false
        cluster_cidr:
          type: string
          description: Pod network override (private IPv4, /12–/24)
          default: 10.42.0.0/16
        service_cidr:
          type: string
          description: Service network override (private IPv4, /12–/24)
          default: 10.43.0.0/16
        region:
          type: string
          enum: [us-east]
          default: us-east

    K8sNodePoolInput:
      type: object
      required: [name, node_count, plan_id]
      properties:
        name:
          type: string
          description: 1–63 lowercase letters, digits or hyphens; unique within the cluster
          example: default-pool
        node_count:
          type: integer
          minimum: 1
          maximum: 20
          description: Per-pool minimum is 1; the cluster needs at least 2 worker nodes across all pools
          example: 3
        plan_id:
          type: integer
          description: Worker plan from [List Kubernetes node plans](#tag/Kubernetes/operation/listK8sNodePlans). Pools in one cluster may use different plans.
          example: 11
        min_nodes:
          type: integer
          description: Autoscaler floor
        max_nodes:
          type: integer
          description: Autoscaler ceiling
        autoscale_enabled:
          type: boolean
          default: false
        labels:
          type: string
          description: 'JSON object of Kubernetes labels applied to the pool''s nodes, e.g. `{"workload":"web"}`'
        taints:
          type: string
          description: 'JSON array of taints, e.g. `[{"key":"gpu","value":"true","effect":"NoSchedule"}]`'

    AddK8sNodePoolRequest:
      type: object
      required: [name, node_count]
      properties:
        name:
          type: string
          example: pool-2
        node_count:
          type: integer
          minimum: 1
          maximum: 20
        plan_id:
          type: integer
          description: Worker plan for this pool — pools may use different plans. Omit to inherit the first pool's plan.
        min_nodes:
          type: integer
        max_nodes:
          type: integer
        autoscale_enabled:
          type: boolean
        labels:
          type: string
        taints:
          type: string

    UpdateK8sNodePoolRequest:
      type: object
      properties:
        min_nodes:
          type: integer
        max_nodes:
          type: integer
        autoscale_enabled:
          type: boolean
        labels:
          type: string
        taints:
          type: string

    K8sNodePool:
      type: object
      required: [id, name, node_count, status]
      properties:
        id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
        name:
          type: string
        node_count:
          type: integer
          description: Target node count
        actual_node_count:
          type: integer
          description: Nodes that currently exist (differs from `node_count` while scaling)
        min_nodes:
          type: integer
        max_nodes:
          type: integer
        autoscale_enabled:
          type: boolean
        plan_id:
          type: integer
        cpu:
          type: integer
        ram:
          type: integer
          description: GB
        disk:
          type: integer
          description: GB
        labels:
          type: string
        taints:
          type: string
        status:
          type: string
          enum: [pending, provisioning, running, scaling, failed, deleting, deleted]
          description: '`scaling`/`deleting` are asynchronous — watch `status_message` for the outcome (e.g. a drain blocked by a PodDisruptionBudget)'
        status_message:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/K8sNode'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    K8sNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pool_id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [vnf, master, worker, storage]
          description: '`vnf` is the cluster''s network gateway'
        status:
          type: string
          enum: [pending, provisioning, running, not_ready, cordoned, failed, deleting, deleted]
          description: '`running` means the kubelet reports Ready; `cordoned` = unschedulable (drain or manual cordon); `not_ready` = joined but failing health checks'
        cpu:
          type: integer
        ram:
          type: integer
          description: GB
        disk:
          type: integer
          description: GB
        ip_address:
          type: string
        price_per_hour:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    K8sClusterNode:
      allOf:
        - $ref: '#/components/schemas/K8sNode'
        - type: object
          properties:
            has_live_data:
              type: boolean
              description: Live Kubernetes state was reachable for this node
            live_name:
              type: string
              description: Kubernetes node name
            ready:
              type: boolean
            kubelet_version:
              type: string
            os_image:
              type: string
            cpu_used_millicores:
              type: integer
            cpu_capacity_millicores:
              type: integer
            mem_used_bytes:
              type: integer
            mem_capacity_bytes:
              type: integer

    K8sNodeMetrics:
      type: object
      properties:
        name:
          type: string
          description: Kubernetes node name
        internal_ip:
          type: string
        roles:
          type: string
          example: control-plane,etcd
        ready:
          type: boolean
        cpu_used_millicores:
          type: integer
        cpu_capacity_millicores:
          type: integer
        mem_used_bytes:
          type: integer
        mem_capacity_bytes:
          type: integer

    K8sControlPlaneHealth:
      type: object
      description: 24-hour control-plane health summary, sampled every minute. Absent until the first sample after the cluster starts running.
      properties:
        sampled_at:
          type: string
          format: date-time
        etcd_p99_ms:
          type: number
          format: double
          description: 99th-percentile etcd request latency over the last minute (healthy clusters sit under 15 ms; sustained values above 100 ms degrade the control plane)
        etcd_p99_ms_max_24h:
          type: number
          format: double
        apiserver_5xx_24h:
          type: integer
        restarts_apiserver_24h:
          type: integer
        restarts_etcd_24h:
          type: integer
        restarts_scheduler_24h:
          type: integer
        restarts_controller_24h:
          type: integer
        restarts_cilium_op_24h:
          type: integer
        leader_changes_24h:
          type: integer
          description: Scheduler + controller-manager restarts — lost leader leases
        not_ready_minutes_24h:
          type: integer
        nodes_not_ready:
          type: integer

    K8sClusterStats:
      type: object
      properties:
        cluster_id:
          type: string
          description: Short cluster ID
        has_data:
          type: boolean
        cpu_used_millicores:
          type: integer
        cpu_capacity_millicores:
          type: integer
        mem_used_bytes:
          type: integer
        mem_capacity_bytes:
          type: integer
        pod_count:
          type: integer
        nodes_ready:
          type: integer
        nodes_total:
          type: integer
        metrics_updated_at:
          type: string
          format: date-time

    K8sClusterEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
          example: scale_completed
        message:
          type: string
          example: Node pool default-pool scaled from 2 to 3 nodes
        progress:
          type: integer
          description: 0–100 during provisioning
        created_at:
          type: string
          format: date-time

    K8sFirewallState:
      type: object
      properties:
        success:
          type: boolean
        enabled:
          type: boolean
        default_name:
          type: string
          description: Platform baseline security group
          example: raff-default-secure
        assigned_sg_id:
          type: string
          format: uuid
          description: Custom security group currently assigned (absent when on the baseline)
        assigned_name:
          type: string
        available:
          type: array
          description: Your security groups that can be assigned
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              inbound_rules:
                type: integer
              outbound_rules:
                type: integer

    K8sMetalLBPool:
      type: object
      properties:
        enabled:
          type: boolean
        found:
          type: boolean
          description: The address pool exists in the cluster
        addresses:
          type: string
          example: 10.1.0.238-10.1.0.253
        size:
          type: integer
        max_size:
          type: integer

    K8sTcpForward:
      type: object
      properties:
        index:
          type: integer
        public_port:
          type: integer
        protocol:
          type: string
          example: tcp
        backend_ip:
          type: string
        backend_port:
          type: integer
        endpoint:
          type: string
          description: Public address of the forward
          example: 23.26.4.133:5432

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BillingValidationFailed:
      description: |
        Billing validation failed. The account is not in good standing.
        Check the `reason` field:
        - `banned` — account suspended
        - `failed` — last payment failed; top up the account balance
        - `no_billing_customer` — billing not set up
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillingError'
    MissingProjectID:
      description: X-Project-ID header is required for this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Bad Request
            message: X-Project-ID required
    InsufficientBalance:
      description: |
        Account balance is insufficient for this operation. Top up the balance and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Payment Required
            message: Insufficient balance for subscription
