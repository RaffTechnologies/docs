          items:
            type: string
          description: Ready-made trigger payloads mapped from EventBridge schedules
        warnings:
          type: array
          items:
            type: string
          description: Every guess or behavior difference — review before deploying
        out_of_scope:
          type: array
          items:
            type: string
          description: Items that are not migrated, with alternatives
        free_remaining_month:
          type: integer
        conversion_price:
          type: number
        charged:
          type: boolean

    FunctionRuntimeInfo:
      type: object
      properties:
        id:
          type: string
          enum: [python, node, go, docker]
        label:
          type: string
        handler_kind:
          type: string
        signature:
          type: string
        available:
          type: boolean
        detect_hint:
          type: string

    FunctionsPricing:
